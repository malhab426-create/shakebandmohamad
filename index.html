<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أسطول — إدارة أسطول المركبات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:'Tajawal',system-ui,sans-serif;background:#f4f5f3;color:#2c3531;font-size:15px;line-height:1.7}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
input,select,textarea{font-family:inherit;font-size:13.5px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#4a6b5f!important;box-shadow:0 0 0 3px rgba(74,107,95,.12)}
.hidden{display:none!important}
.ico{display:inline-block;vertical-align:middle;flex:0 0 auto}

/* ═══════════════════════════════════════════════════════════
   Auth Screen
   ═══════════════════════════════════════════════════════════ */
#authScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#eef2ef 0%,#f4f5f3 70%);z-index:1000;padding:20px;overflow-y:auto}
.auth-card{background:#fff;border:1px solid #e6e8e4;border-radius:14px;padding:30px;width:100%;max-width:440px;box-shadow:0 20px 50px -25px rgba(38,49,45,.3)}
.auth-logo{margin-bottom:24px;display:flex;justify-content:center}
.auth-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.auth-subtitle{font-size:13px;color:#727c77;text-align:center;margin-bottom:24px}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:12.5px;color:#727c77;margin-bottom:5px;font-weight:500}
.auth-field input{width:100%;border:1px solid #e6e8e4;border-radius:8px;padding:10px 12px;font-size:14px;background:#fff;color:#2c3531}
#authError{display:none;background:#fdecea;color:#9a5750;border:1px solid #f5c6cb;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px;line-height:1.6;white-space:pre-line}
#authDiag{font-size:12.5px;margin-bottom:14px}
.auth-btn{width:100%;border:0;border-radius:8px;padding:12px;font-size:15px;font-weight:500;background:#4a6b5f;color:#fff;transition:background .15s}
.auth-btn:hover:not(:disabled){background:#3a564b}
.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.auth-switch{text-align:center;margin-top:16px;font-size:13px;color:#727c77}
.auth-switch a{color:#4a6b5f;cursor:pointer;text-decoration:underline;font-weight:500}

/* ═══════════════════════════════════════════════════════════
   App
   ═══════════════════════════════════════════════════════════ */
.app-header{background:#26312d;color:#e8ede9;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.app-header .brand{display:flex;align-items:center;gap:12px}
.app-nav{background:#2a3631;padding:8px 20px;display:flex;gap:4px;flex-wrap:wrap;overflow-x:auto}
.nav-btn{background:transparent;color:#9aa8a2;border:0;padding:8px 14px;border-radius:7px;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.nav-btn:hover{background:rgba(255,255,255,.05);color:#e8ede9}
.nav-btn.active{background:rgba(255,255,255,.12);color:#fff;font-weight:500}
.nav-badge{background:#9a5750;color:#fff;border-radius:10px;padding:1px 6px;font-size:10.5px;font-weight:600;margin-inline-start:4px}
.app-main{padding:24px 32px;max-width:1400px;margin:0 auto}
@media (max-width:1024px){.app-main{padding:20px 16px}}

.user-info{display:flex;align-items:center;gap:12px;font-size:13px}
.user-info .name{font-weight:600;color:#fff}
.user-info .role{font-size:11px;color:#829588}
.signout-btn{background:transparent;border:1px solid rgba(255,255,255,.15);color:#dfe8e3;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer}
.signout-btn:hover{background:rgba(255,255,255,.06)}

/* Cards */
.card{background:#fff;border:1px solid #e6e8e4;border-radius:10px;overflow:hidden;margin-bottom:20px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid #eef0ec}
.card-head h3{font-size:14px;font-weight:600}
.card-body{padding:20px}
.data-table{width:100%;border-collapse:collapse;font-size:13.5px}
.data-table th{text-align:start;font-weight:500;color:#727c77;font-size:12px;padding:10px 18px;border-bottom:1px solid #e6e8e4;background:#fafbf9;white-space:nowrap}
.data-table td{padding:14px 18px;border-bottom:1px solid #eef0ec;vertical-align:middle}
.data-table tr:last-child td{border-bottom:0}
.data-table tr.clickable{cursor:pointer}
.data-table tr.clickable:hover{background:#fafbf9}
.data-table td.actions{white-space:nowrap;text-align:end}

/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:#e6e8e4;border:1px solid #e6e8e4;border-radius:10px;overflow:hidden;margin-bottom:24px}
.stat{background:#fff;padding:18px 22px}
.stat-label{font-size:12px;color:#727c77}
.stat-value{font-size:25px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.stat-sub{font-size:11.5px;color:#9aa39e;margin-top:2px}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}

/* Search */
.search-box{display:flex;align-items:center;gap:8px;background:#fafbf9;border:1px solid #e6e8e4;border-radius:8px;padding:6px 11px;max-width:360px;flex:1;min-width:200px;color:#727c77}
.search-box input{border:0;background:transparent;outline:none;font-size:13.5px;width:100%;color:#2c3531}

/* Fuel bar */
.fuel-bar{display:flex;align-items:center;gap:8px;min-width:110px}
.fuel-track{flex:1;height:4px;border-radius:99px;background:#e8ebe7;overflow:hidden}
.fuel-fill{height:100%;border-radius:99px}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(38,49,45,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;box-shadow:0 20px 50px -25px rgba(38,49,45,.5);display:flex;flex-direction:column;max-height:90vh}
.modal.lg{max-width:900px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:1px solid #eef0ec}
.modal-head h3{font-size:15.5px;font-weight:600}
.modal-head .sub{font-size:12.5px;color:#727c77;margin-top:2px}
.modal-body{padding:20px 22px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid #eef0ec;background:#fafbf9;border-radius:0 0 12px 12px;flex-wrap:wrap}

/* Forms */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid-2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.field label{color:#727c77;font-weight:500}
.field input,.field select,.field textarea{border:1px solid #e6e8e4;border-radius:8px;padding:8px 11px;font-size:13.5px;background:#fff;width:100%;color:#2c3531}
.field input[readonly]{background:#f7f8f6;color:#727c77}
.field textarea{resize:vertical;min-height:70px}
.field em{color:#9a5750;font-style:normal}
.field input.invalid,.field select.invalid,.field textarea.invalid{border-color:#9a5750!important;background:#fdf8f7}
.full{grid-column:1/-1}
.form-section{margin-top:20px;padding-top:16px;border-top:1px solid #eef0ec}
.form-section:first-child{margin-top:0;padding-top:0;border-top:0}
.form-section h4{font-size:13px;font-weight:600;margin-bottom:12px;color:#2c3531;display:flex;align-items:center;gap:8px}
.banner{background:#fafbf9;border:1px solid #e6e8e4;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:#727c77}
.banner strong{color:#2c3531}
.radio-row{display:flex;gap:22px;margin-bottom:12px}
.radio-row label{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;cursor:pointer;color:#2c3531}
.radio-row input{accent-color:#4a6b5f}
.checkbox-field{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.7;color:#727c77;cursor:pointer;background:#fafbf9;border:1px solid #e6e8e4;border-radius:8px;padding:12px 14px}
.checkbox-field input{margin-top:3px;accent-color:#4a6b5f;flex:0 0 auto}
.checkbox-field.invalid{border-color:#9a5750;background:#fdf8f7}

/* Items table */
.items-wrap{border:1px solid #e6e8e4;border-radius:8px;overflow:hidden}
.items-table{width:100%;border-collapse:collapse;font-size:13px}
.items-table th{padding:8px 10px;font-size:11.5px;background:#fafbf9;text-align:start;font-weight:500;color:#727c77;border-bottom:1px solid #e6e8e4;white-space:nowrap}
.items-table td{padding:6px 10px;border-bottom:1px solid #eef0ec}
.items-table input{border:1px solid #e6e8e4;border-radius:6px;padding:5px 8px;font-size:13px;width:100%;background:#fff}
.items-table .item-price,.items-table .item-qty,.items-table .item-disc{width:90px}
.items-table .item-desc{min-width:150px}
.items-table .item-total{font-variant-numeric:tabular-nums;font-weight:500;color:#727c77;text-align:center}
.items-total{margin-top:10px;text-align:end;font-size:13.5px;color:#727c77}
.items-total strong{color:#2c3531;font-size:15px}
.items-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

/* Files */
.file-field{margin-bottom:14px}
.file-label{display:block;font-size:12.5px;color:#727c77;margin-bottom:5px;font-weight:500}
.file-label em{color:#9a5750;font-style:normal}
.file-label input[type=file]{display:block;margin-top:6px;font-size:12.5px;border:1px dashed #e6e8e4;border-radius:7px;padding:8px;width:100%;color:#727c77}
.file-label input[type=file].invalid{border-color:#9a5750;background:#fdf8f7}
.file-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.file-chip{display:inline-flex;align-items:center;gap:4px;background:#f3f5f2;border:1px solid #e6e8e4;border-radius:6px;padding:3px 9px;font-size:12px;color:#2c3531}
.file-chip button{background:transparent;border:0;color:#9aa39e;padding:0;margin-inline-start:2px;display:inline-flex;cursor:pointer}
.file-chip button:hover{color:#9a5750}

/* Details */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px}
.detail-grid > div > .lbl{font-size:11.5px;color:#727c77;margin-bottom:2px}

/* Map */
.map{position:relative;height:340px;border-radius:10px;overflow:hidden;border:1px solid #e6e8e4;background:linear-gradient(180deg,#f7f9f7,#eef2ee)}
.map::before{content:'';position:absolute;inset:0;opacity:.6;background-image:linear-gradient(#e3e8e2 1px,transparent 1px),linear-gradient(90deg,#e3e8e2 1px,transparent 1px);background-size:36px 36px}
.map-pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#4a5a53;font-weight:500}
.map-dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 3px rgba(74,107,95,.15)}

/* Toast */
.toast-box{position:fixed;bottom:20px;inset-inline-start:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{background:#26312d;color:#e8ede9;padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 12px 28px -18px rgba(38,49,45,.7);max-width:340px;display:flex;align-items:center;gap:9px}
.toast.red{background:#7c4640}
.toast.amber{background:#7a6438}

/* Vehicle detail header */
.detail-header{background:#fff;border:1px solid #e6e8e4;border-radius:10px;padding:20px 24px;margin-bottom:16px}
.detail-title{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.detail-title .avatar{width:52px;height:52px;border-radius:12px;background:#eef2ef;color:#4a6b5f;display:grid;place-items:center;flex:0 0 auto}
.detail-title h1{font-size:22px;font-weight:700;margin:0}
.detail-title .sub{color:#727c77;font-size:13px;margin-top:2px}
.detail-tabs{display:flex;gap:4px;border-bottom:1px solid #e6e8e4;margin-top:16px;overflow-x:auto}
.detail-tab{background:transparent;border:0;padding:10px 16px;font-size:13.5px;color:#727c77;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.detail-tab:hover{color:#2c3531}
.detail-tab.active{color:#4a6b5f;border-bottom-color:#4a6b5f;font-weight:500}
.stat-mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:14px 0}
.stat-mini .item{background:#fafbf9;border:1px solid #eef0ec;border-radius:8px;padding:10px 14px}
.stat-mini .lbl{font-size:11.5px;color:#727c77}
.stat-mini .val{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}

/* Reports */
.report-filter{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.report-bars{display:flex;flex-direction:column;gap:10px}
.report-bar{display:grid;grid-template-columns:180px 1fr 100px;gap:12px;align-items:center;font-size:13px}
.report-bar .fill{height:8px;border-radius:4px;background:#4a6b5f;opacity:.75}
.report-bar .fill.amber{background:#8f7440}
.report-bar .fill.red{background:#9a5750}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:500;background:transparent;color:#2c3531}
.btn-ghost{background:#fff;border:1px solid #e6e8e4;color:#2c3531}
.btn-ghost:hover{background:#f7f8f6}
.btn-primary-sm{background:#4a6b5f;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:13.5px}
.btn-primary-sm:hover{background:#3a564b}
.btn-sm{padding:5px 10px;font-size:12.5px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;border:0;background:transparent;color:#9aa39e;padding:0}
.icon-btn:hover{background:#eef0ec;color:#2c3531}
.icon-btn.danger:hover{background:#f6eceb;color:#9a5750}
</style>
</head>
<body>

<div id="authScreen" style="display:flex">
  <div class="auth-card">
    <div class="auth-logo" id="authLogo"></div>
    <h2 class="auth-title" id="authTitle">تسجيل الدخول</h2>
    <p class="auth-subtitle" id="authSubtitle">أدخل بيانات حسابك للمتابعة</p>
    <div id="authError"></div>
    <div id="authDiag"></div>
    <div class="auth-field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="authEmail" dir="ltr" autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="auth-field">
      <label>كلمة المرور</label>
      <input type="password" id="authPassword" dir="ltr" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div class="auth-field hidden" id="authNameField">
      <label>الاسم الكامل</label>
      <input type="text" id="authName" placeholder="اسمك الكامل">
    </div>
    <button class="auth-btn" id="authSubmit">تسجيل الدخول</button>
    <div class="auth-switch">
      <span id="authSwitchText">ليس لديك حساب؟</span>
      <a id="authSwitchLink">إنشاء حساب</a>
    </div>
  </div>
</div>

<div id="appRoot" class="hidden">
  <header class="app-header">
    <div class="brand" id="headerLogo"></div>
    <div class="user-info">
      <div style="text-align:end">
        <div class="name" id="headerUserName">—</div>
        <div class="role" id="headerUserRole">—</div>
      </div>
      <button class="signout-btn" onclick="window.doSignOut()">خروج</button>
    </div>
  </header>
  <nav class="app-nav" id="appNav"></nav>
  <main class="app-main" id="appView"></main>
</div>

<div id="modalRoot"></div>
<div id="toasts" class="toast-box"></div>

<script>
(function() {

/* ═══════════════════════════════════════════════════════════════

/* ═══════════════════════════════════════════════════════════════
   ⚙️ Supabase — استبدل ANON_KEY بمفتاحك

/* ═══════════════════════════════════════════════════════════════
   🛠️ Utilities
   ═══════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const uid = p => (p||'id') + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const addDays = (iso,n) => { const d = new Date(iso); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const clamp = (n,a,b) => Math.min(b, Math.max(a,n));
const fmtNum = n => Number(n||0).toLocaleString('en-US');
const money = n => fmtNum(Math.round(Number(n||0)*100)/100) + ' د.إ';
const fmtDate = iso => { if(!iso) return '—'; const d = new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('ar-EG',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtTime = ts => { if(!ts) return '—'; return new Date(ts).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}); };
const timeAgo = ts => { if(!ts) return '—'; const m = Math.floor((Date.now()-new Date(ts).getTime())/60000); if(m<1) return 'الآن'; if(m<60) return `قبل ${m} د`; if(m<1440) return `قبل ${Math.floor(m/60)} س`; return `قبل ${Math.floor(m/1440)} ي`; };
const daysUntil = iso => { if(!iso) return null; const a = new Date(iso+'T00:00:00'), b = new Date(todayISO()+'T00:00:00'); return Math.round((a-b)/86400000); };
const haversine = (lat1,lon1,lat2,lon2) => { const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(a)); };
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const monthStart = () => todayISO().slice(0,7) + '-01';

function isValidPhone(phone) {
  const digits = String(phone || '').replace(/\D/g, '');
  return digits.length === 10;
}
function normalizeNumber(str) {
  return String(str || '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d]/g, '');
}

/* ═══════════════════════════════════════════════════════════════

const ICONS = {
  dashboard:'<rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/>',
  truck:'<rect x="1" y="5" width="14" height="12" rx="2"/><path d="M15 9h3.4l3.6 3.6V17h-7z"/><circle cx="5.5" cy="19" r="2"/><circle cx="18" cy="19" r="2"/>',

async function loadAllData() {
  const tables = ['vehicles','drivers','maintenance','tracking','trackingLog','tasks','requests','documents','fuel','violations'];
  const results = await Promise.all(tables.map(t => sb.from(t).select('*')));
  const data = {};
  tables.forEach((t, i) => {
    if (results[i].error) {
      console.warn(`[LOAD ${t}]`, results[i].error.message);
      data[t] = [];
    } else {
      data[t] = results[i].data || [];
    }
  });
  return data;
}

async function sbInsert(table, record) {
  const { error } = await sb.from(table).insert(record);
  if (error) { console.error(`[INSERT ${table}]`, error); throw new Error(error.message); }
}
async function sbUpdate(table, id, updates) {
  const { error } = await sb.from(table).update(updates).eq('id', id);
  if (error) { console.error(`[UPDATE ${table}]`, error); throw new Error(error.message); }
}
async function sbDelete(table, id) {
  const { error } = await sb.from(table).delete().eq('id', id);
  if (error) { console.error(`[DELETE ${table}]`, error); throw new Error(error.message); }
}

async function fetchProfile(userId) {
  const { data, error } = await sb.from('profiles').select('*').eq('id', userId).maybeSingle();
  if (error) {
    console.warn('[PROFILE] read error:', error.message);
    return null;
  }
  return data;
}

async function handleSession(session) {
  if (!session || !session.user) {
    showAuthScreen();
    return;
  }
  currentUser = session.user;
  let profile = await fetchProfile(session.user.id);

  if (!profile) {
    // Create profile if missing (fallback if trigger failed)
    const { data: created, error } = await sb.from('profiles').insert({
      id: session.user.id,
      email: session.user.email,
      full_name: session.user.user_metadata?.full_name || session.user.email,
      role: 'user'
    }).select().single();
    if (error) {
      console.warn('[PROFILE] create failed:', error.message);
      profile = { id: session.user.id, email: session.user.email, full_name: session.user.email, role: 'user' };
    } else {
      profile = created;
    }
  }
  currentProfile = profile;

  // Diagnostic if user expected admin
  if (profile.role !== 'admin') {
    const email = session.user.email;
    showAuthDiag(`<div class="banner" style="background:#fff8e1;border-color:#f0d477;color:#7c5a20">
      <strong>ملاحظة:</strong> أنت مسجل كـ <strong>مستخدم عادي</strong>.
      إذا كنت تتوقع صلاحيات المدير، نفّذ في Supabase SQL Editor:
      <pre style="background:#fef0c0;padding:6px 10px;border-radius:5px;margin-top:6px;font-size:11px;overflow-x:auto;direction:ltr">update public.profiles set role='admin' where email='${email}';</pre>
      ثم سجّل خروج ودخول مرة أخرى.
    </div>`);
  }

  // Load data
  try {
    state.data = await loadAllData();
    state.loaded = true;
  } catch(e) {
    console.error('[DATA] load failed:', e);
    toast('تعذر تحميل البيانات', 'red');
  }

  showAppScreen();
}

async function doAuth() {
  hideAuthError();
  clearAuthDiag();

  const email = ($('#authEmail')?.value || '').trim();
  const password = $('#authPassword')?.value || '';
  const fullName = ($('#authName')?.value || '').trim();

  if (!email) { showAuthError('أدخل البريد الإلكتروني'); $('#authEmail')?.focus(); return; }
  if (!password) { showAuthError('أدخل كلمة المرور'); $('#authPassword')?.focus(); return; }
  if (authMode === 'signup' && !fullName) { showAuthError('أدخل الاسم الكامل'); $('#authName')?.focus(); return; }
  if (authMode === 'signup' && password.length < 6) { showAuthError('كلمة المرور 6 أحرف على الأقل'); return; }

  const btn = $('#authSubmit');
  if (btn) { btn.disabled = true; btn.textContent = 'جاري...'; }

  try {
    if (authMode === 'signup') {
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { full_name: fullName } }
      });
      if (error) throw error;
      if (data.user && !data.session) {
        showAuthError('تم إنشاء الحساب. يرجى تأكيد البريد الإلكتروني أو تواصل مع المدير.');
        return;
      }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (e) {
    console.error('[AUTH]', e);
    let msg = e.message || 'حدث خطأ';
    if (msg.includes('Invalid login credentials')) msg = 'البريد أو كلمة المرور غير صحيحة';
    else if (msg.includes('already registered')) msg = 'هذا البريد مسجل مسبقاً';
    else if (msg.includes('Email not confirmed')) msg = 'يرجى تأكيد البريد الإلكتروني أولاً';
    showAuthError(msg);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = authMode === 'signup' ? 'إنشاء الحساب' : 'تسجيل الدخول'; }
  }
}

const getVehicle = id => state.data.vehicles.find(v => v.id === id);
const vehicleLabel = id => { const v = getVehicle(id); return v ? `${v.make} ${v.model} — ${v.plate}` : '—'; };
const matchAny = (n, ...fields) => !n || fields.some(f => String(f||'').toLowerCase().includes(String(n).toLowerCase()));
const q = v => (state.search[v]||'').trim();
const nextMaintNo = () => {
  const nums = state.data.maintenance.map(m => parseInt((m.requestNo||'').replace(/\D/g,''),10)).filter(n => !isNaN(n));
  return 'MT-' + String((nums.length?Math.max(...nums):0)+1).padStart(4,'0');
};
const itemsTotal = items => (items||[]).reduce((s,it) => s + Math.max(0, Number(it.price||0)*Number(it.qty||0) - Number(it.discount||0)), 0);

function computeConsumption(fuelId) {
  const current = state.data.fuel.find(f => f.id === fuelId);
  if (!current || !current.odometer || !current.liters) return null;
  const sameVehicle = state.data.fuel
    .filter(f => f.vehicleId === current.vehicleId && f.odometer > 0)
    .sort((a, b) => (a.date !== b.date) ? a.date.localeCompare(b.date) : (a.odometer||0)-(b.odometer||0));
  const idx = sameVehicle.findIndex(f => f.id === fuelId);
  if (idx <= 0) return null;
  const distance = current.odometer - sameVehicle[idx-1].odometer;
  if (distance <= 0) return null;
  return distance / current.liters;
}

function vehicleStats(vehicleId) {
  const fuel = state.data.fuel.filter(f => f.vehicleId === vehicleId);
  const maint = state.data.maintenance.filter(m => m.vehicleId === vehicleId && m.status === 'closed');
  const viol = state.data.violations.filter(v => v.vehicleId === vehicleId);
  const totalFuel = fuel.reduce((s,f) => s + Number(f.cost||0), 0);
  const totalLiters = fuel.reduce((s,f) => s + Number(f.liters||0), 0);
  const totalMaint = maint.reduce((s,m) => s + Number(m.cost||0), 0);
  const totalViol = viol.reduce((s,v) => s + Number(v.amount||0), 0);
  let distance = 0;
  if (fuel.length >= 2) {
    const sorted = [...fuel].sort((a,b) => a.date.localeCompare(b.date));
    distance = Math.max(0, (sorted[sorted.length-1].odometer||0) - (sorted[0].odometer||0));
  }
  const consumption = distance > 0 ? (totalLiters / distance * 100) : 0;
  const costPerKm = distance > 0 ? ((totalFuel + totalMaint + totalViol) / distance) : 0;
  const unpaidViol = viol.filter(v => v.status === 'unpaid').reduce((s,v) => s + Number(v.amount||0), 0);
  return { totalFuel, totalLiters, totalMaint, totalViol, totalCost: totalFuel + totalMaint + totalViol, distance, consumption, costPerKm, unpaidViol, fuelCount: fuel.length, maintCount: maint.length, violCount: viol.length };
}

function computeAlerts() {
  if (!state.data) return [];
  const { vehicles, requests, tasks, documents, drivers, violations } = state.data;
  const out = [];
  const today = todayISO();
  vehicles.forEach(v => {
    if (v.fuelLevel <= 25) out.push({ tone:'red', view:'fuel', title:`وقود منخفض — ${v.plate}`, text:`المتبقي ${v.fuelLevel}%` });
    const remain = Number(v.nextServiceKm) - Number(v.odometer);
    if (v.nextServiceKm > 0 && remain <= 0) out.push({ tone:'red', view:'maintenance', title:`تجاوز الصيانة — ${v.plate}`, text:`${fmtNum(v.odometer)} كم` });
    else if (v.nextServiceKm > 0 && remain <= 1500) out.push({ tone:'amber', view:'maintenance', title:`صيانة قريبة — ${v.plate}`, text:`يتبقى ${fmtNum(remain)} كم` });
    const unpaid = violations.filter(vi => vi.vehicleId === v.id && vi.status === 'unpaid');
    if (unpaid.length) {
      const total = unpaid.reduce((s,x) => s + Number(x.amount||0), 0);
      out.push({ tone:'red', view:'violations', title:`${unpaid.length} مخالفة — ${v.plate}`, text:`بإجمالي ${money(total)}` });
    }
  });
  const pending = requests.filter(r => ['new','review','approved'].includes(r.status));
  if (pending.length) out.push({ tone:'blue', view:'requests', title:`${pending.length} طلب معلّق`, text:'راجع الطلبات' });
  const overdue = tasks.filter(t => t.status === 'scheduled' && t.endDate < today);
  if (overdue.length) out.push({ tone:'amber', view:'tasks', title:`${overdue.length} مهمة متأخرة`, text:'تجاوزت الانتهاء' });
  documents.forEach(d => {
    const v = getVehicle(d.vehicleId);
    const days = daysUntil(d.expiryDate);
    const label = DOC_TYPES[d.type] ? DOC_TYPES[d.type][0] : 'وثيقة';
    if (days === null) return;
    if (days < 0) out.push({ tone:'red', view:'documents', title:`وثيقة منتهية — ${label}`, text:`${v?v.plate:''}` });
    else if (days <= 30) out.push({ tone:'amber', view:'documents', title:`وثيقة قاربت — ${label}`, text:`${v?v.plate:''} · ${days} يوم` });
  });
  drivers.forEach(dr => {
    if (!dr.licenseExpiry) return;
    const days = daysUntil(dr.licenseExpiry);
    if (days === null) return;
    if (days < 0) out.push({ tone:'red', view:'vehicles', title:`رخصة منتهية — ${dr.name}`, text:fmtDate(dr.licenseExpiry) });
    else if (days <= 30) out.push({ tone:'amber', view:'vehicles', title:`رخصة قاربت — ${dr.name}`, text:`${days} يوم` });
  });
  return out;
}

function pageHead(title, subtitle, actions='') {

    <div style="display:flex;gap:8px;flex-wrap:wrap">${actions}</div>

}
function stat(label, value, sub='') {
  return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div>${sub?`<div class="stat-sub">${sub}</div>`:''}</div>`;
}
function fuelBar(level) {
  const l = clamp(Number(level)||0, 0, 100);
  const c = l <= 25 ? '#9a5750' : l <= 50 ? '#8f7440' : '#5a7d63';
  return `<div class="fuel-bar"><div class="fuel-track"><div class="fuel-fill" style="width:${l}%;background:${c}"></div></div><span style="font-size:12px;color:#727c77">${l}%</span></div>`;
}
function field(label, name, value='', opts={}) {
  const { type='text', required=false, placeholder='', min, max, step, readonly=false } = opts;
  return `<label class="field"><label>${label}${required?' <em>*</em>':''}</label>
    <input type="${type}" name="${name}" value="${esc(value??'')}" ${placeholder?`placeholder="${placeholder}"`:''} ${readonly?'readonly':''} ${min!==undefined?`min="${min}"`:''} ${max!==undefined?`max="${max}"`:''} ${step!==undefined?`step="${step}"`:''}>
  </label>`;
}
function phoneField(label, name, value='', opts={}) {
  const { required=false } = opts;
  return `<label class="field"><label>${label}${required?' <em>*</em>':''}</label>
    <input type="tel" name="${name}" value="${esc(normalizeNumber(value))}" placeholder="05XXXXXXXX" inputmode="numeric" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
    <span style="font-size:11px;color:#9aa39e">10 أرقام بالضبط</span>

function selectField(label, name, map, value) {

function textareaField(label, name, value='', placeholder='') {

function vehicleSelect(value) {

/* ═══════════════════════════════════════════════════════════════
   🪟 Modal
   ═══════════════════════════════════════════════════════════════ */
function openModal({ title, subtitle='', body, submitLabel='حفظ', cancelLabel='إلغاء', tone='primary', size='', footExtra='', onSubmit }) {
  const root = $('#modalRoot'); if (!root) return;
  const btnStyle = tone === 'danger'
    ? 'background:#9a5750;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:13.5px;cursor:pointer'
    : 'background:#4a6b5f;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:13.5px;cursor:pointer';
  root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)window.closeModal()">
    <div class="modal ${size==='lg'?'lg':''}">
      <div class="modal-head">
        <div><h3>${title}</h3>${subtitle?`<div class="sub">${subtitle}</div>`:''}</div>
        <button type="button" class="icon-btn" onclick="window.closeModal()">${icon('x',18)}</button>
      </div>
      <form id="modalForm" class="modal-body" onsubmit="event.preventDefault()">${body}</form>
      <div class="modal-foot">
        ${footExtra||''}
        <button type="button" class="btn-ghost" onclick="window.closeModal()">${cancelLabel}</button>
        <button type="button" id="modalSubmit" style="${btnStyle}">${submitLabel}</button>
      </div>
    </div>
  </div>`;
  const form = $('#modalForm'); const btn = $('#modalSubmit');
  const submit = async () => {
    const fd = Object.fromEntries(new FormData(form).entries());
    if (!onSubmit) { window.closeModal(); return; }
    btn.disabled = true; const orig = btn.textContent; btn.textContent = 'جاري...';
    try { const r = await onSubmit(fd, form); if (r !== false) window.closeModal(); }
    catch (e) { console.error('[MODAL]', e); toast(e.message || 'حدث خطأ', 'red'); }
    finally { btn.disabled = false; btn.textContent = orig; }
  };
  btn.onclick = submit;
  form.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); submit(); }
  });
  setTimeout(() => form.querySelector('input:not([readonly]),select,textarea')?.focus(), 60);
}
function closeModal() { const r = $('#modalRoot'); if (r) r.innerHTML = ''; }
function confirmDialog(title, msg, onConfirm, label='تأكيد') {
  openModal({ title, body:`<p style="color:#4a544f;line-height:1.8;font-size:14px">${msg}</p>`, submitLabel:label, tone:'danger', onSubmit: async () => { await onConfirm(); } });
}
function toast(msg, tone='green') {
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (tone === 'green' ? '' : tone);
  el.innerHTML = `${icon(tone === 'red' ? 'alert' : 'check', 15)}<span>${esc(msg)}</span>`;
  box.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function itemRowHTML(it = {}) {
  const p = it.price ?? 0, q = it.qty ?? 1, d = it.discount ?? 0;
  const total = Math.max(0, p*q - d);
  return `<tr class="item-row">
    <td><input type="text" class="item-desc" value="${esc(it.description||'')}" placeholder="الوصف"></td>
    <td><input type="number" class="item-price" value="${p}" min="0" step="0.01"></td>
    <td><input type="number" class="item-qty" value="${q}" min="1"></td>
    <td class="item-total">${total.toFixed(2)}</td>
    <td><input type="number" class="item-disc" value="${d}" min="0" step="0.01"></td>
    <td><button type="button" class="icon-btn danger item-remove">${icon('trash',13)}</button></td>
  </tr>`;
}
function initItemsBlock(form) {
  const body = form.querySelector('#itemsBody');
  const addBtn = form.querySelector('#addItemBtn');
  if (!body || !addBtn) return;
  const recalc = () => {
    const el = form.querySelector('#itemsGrandTotal');
    if (!el) return;
    let g = 0;
    form.querySelectorAll('.item-row').forEach(row => {
      const p = parseFloat(row.querySelector('.item-price').value) || 0;
      const q = parseFloat(row.querySelector('.item-qty').value) || 0;
      const d = parseFloat(row.querySelector('.item-disc').value) || 0;
      const t = Math.max(0, p*q - d);
      row.querySelector('.item-total').textContent = t.toFixed(2);
      g += t;
    });
    el.textContent = g.toFixed(2) + ' د.إ';
  };
  addBtn.onclick = () => { body.insertAdjacentHTML('beforeend', itemRowHTML({})); recalc(); };
  body.addEventListener('click', e => {
    const b = e.target.closest('.item-remove');
    if (b) { b.closest('.item-row').remove(); recalc(); }
  });
  body.addEventListener('input', recalc);
  recalc();
}
function collectItems(form) {
  return [...form.querySelectorAll('.item-row')].map(row => ({
    description: row.querySelector('.item-desc').value.trim(),
    price: parseFloat(row.querySelector('.item-price').value) || 0,
    qty: parseFloat(row.querySelector('.item-qty').value) || 0,
    discount: parseFloat(row.querySelector('.item-disc').value) || 0
  })).filter(it => it.description || it.price > 0);
}
function fileFieldHTML(label, key, existing = [], required = false) {
  const list = Array.isArray(existing) ? existing : [];
  return `<div class="file-field">
    <label class="file-label">${label}${required?' <em>*</em>':''}
      <input type="file" accept="image/*,.pdf" multiple data-attach="${key}">
    </label>
    <div class="file-list" data-filelist="${key}">
      ${list.map(f => `<span class="file-chip">${esc(f)}<button type="button" data-rm-file="${key}">${icon('x',12)}</button></span>`).join('')}
    </div>
  </div>`;
}
function singleFileFieldHTML(label, key, existing = '', required = false) {
  return `<div class="file-field">
    <label class="file-label">${label}${required?' <em>*</em>':''}
      <input type="file" accept="image/*" data-single="${key}">
    </label>
    <div class="file-list" data-filelist="${key}">
      ${existing ? `<span class="file-chip">${esc(existing)}<button type="button" data-rm-file="${key}">${icon('x',12)}</button></span>` : ''}
    </div>
  </div>`;
}
function initFileUploads(form) {
  form.querySelectorAll('input[type=file][data-attach]').forEach(inp => {
    inp.addEventListener('change', () => {
      const key = inp.dataset.attach;
      const list = form.querySelector(`[data-filelist="${key}"]`);
      [...inp.files].forEach(f => {
        const chip = document.createElement('span');
        chip.className = 'file-chip';
        chip.innerHTML = `${esc(f.name)}<button type="button" data-rm-file="${key}">${icon('x',12)}</button>`;
        list.appendChild(chip);
      });
      inp.value = ''; inp.classList.remove('invalid');
    });
  });
  form.querySelectorAll('input[type=file][data-single]').forEach(inp => {
    inp.addEventListener('change', () => {
      const key = inp.dataset.single;
      const list = form.querySelector(`[data-filelist="${key}"]`);
      list.innerHTML = '';
      if (inp.files[0]) {
        const chip = document.createElement('span');
        chip.className = 'file-chip';
        chip.innerHTML = `${esc(inp.files[0].name)}<button type="button" data-rm-file="${key}">${icon('x',12)}</button>`;
        list.appendChild(chip);
      }
      inp.value = ''; inp.classList.remove('invalid');
    });
  });
  form.addEventListener('click', e => {
    const rm = e.target.closest('[data-rm-file]');
    if (rm) rm.closest('.file-chip').remove();
  });
}
function validateFiles(form, key, min = 1) {
  const count = form.querySelectorAll(`[data-filelist="${key}"] .file-chip`).length;
  if (count < min) {
    const inp = form.querySelector(`[data-attach="${key}"], [data-single="${key}"]`);
    if (inp) inp.classList.add('invalid');
    return false;
  }
  return true;
}
function collectFiles(form) {
  const out = {};
  form.querySelectorAll('[data-filelist]').forEach(list => {
    out[list.dataset.filelist] = [...list.querySelectorAll('.file-chip')].map(c => {
      const btn = c.querySelector('button'); if (btn) btn.remove();
      return c.textContent.trim();
    });
  });
  return out;
}
function collectSingleFile(form, key) {
  const files = collectFiles(form);
  return (files[key] && files[key][0]) || '';
}

/* ═══════════════════════════════════════════════════════════════
   📥 CSV Export
   ═══════════════════════════════════════════════════════════════ */
function exportCSV(filename, headers, rows) {
  const escape = v => { const s = String(v ?? ''); if (s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g,'""') + '"'; return s; };
  const csv = '\uFEFF' + [headers.map(escape).join(','), ...rows.map(r => r.map(escape).join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  toast('تم التصدير: ' + filename);
}

    return `<tr><td><div style="font-weight:600">${v?v.make+' '+v.model:'—'}</div><div style="color:#727c77;font-size:12px">${v?v.plate:''}</div></td><td>${tag(DOC_TYPES, d.type)}</td><td><div>${d.name||'—'}</div><div style="color:#727c77;font-size:12px">${d.number||''}</div></td><td>${fmtDate(d.issueDate)}</td><td>${fmtDate(d.expiryDate)}</td><td>${st}</td><td class="actions"><button class="icon-btn" onclick="window.editDoc('${d.id}')">${icon('edit',14)}</button><button class="icon-btn danger" onclick="window.deleteDoc('${d.id}')">${icon('trash',14)}</button></td></tr>`;
  }).join('');
}

function renderDocuments() {
  const docs = state.data.documents;
  const expired = docs.filter(d => { const n = daysUntil(d.expiryDate); return n !== null && n < 0; }).length;
  const expiring = docs.filter(d => { const n = daysUntil(d.expiryDate); return n !== null && n >= 0 && n <= 30; }).length;
  return `${pageHead('الوثائق', `${docs.length} وثيقة · ${expiring} قاربت · ${expired} منتهية`, `<button class="btn-primary-sm" onclick="window.addDoc()">${icon('plus',14)} إضافة</button>`)}
    <div class="stat-grid">${stat('سارية', docs.length - expired - expiring)}${stat('قاربت', expiring)}${stat('منتهية', expired)}</div>
    <div class="card"><div class="card-head"><div class="search-box">${icon('search',14)}<input placeholder="بحث..." value="${esc(q('documents'))}" oninput="window.searchDo('documents',this.value)"></div></div>
    <div style="overflow-x:auto"><table class="data-table"><thead><tr><th>المركبة</th><th>النوع</th><th>الوثيقة</th><th>الإصدار</th><th>الانتهاء</th><th>الحالة</th><th></th></tr></thead><tbody id="tbody-documents">${documentRows()}</tbody></table></div></div>`;
}

function fuelRows() {
  const s = q('fuel');
  const list = state.data.fuel.filter(f => matchAny(s, f.station, vehicleLabel(f.vehicleId))).sort((a,b) => b.date.localeCompare(a.date));
  if (!list.length) return emptyRow(10);
  return list.map(f => {
    const v = getVehicle(f.vehicleId);
    const cons = computeConsumption(f.id);
    return `<tr>
      <td><div style="font-weight:600">${v?v.make+' '+v.model:'—'}</div><div style="color:#727c77;font-size:12px">${v?v.plate:''}</div></td>
      <td>${fmtDate(f.date)}</td>
      <td>${fmtNum(f.liters)} لتر</td>
      <td>${f.pricePerLiter} د.إ</td>
      <td style="font-weight:600">${money(f.cost)}</td>
      <td>${fmtNum(f.odometer)} كم</td>
      <td style="font-weight:600;color:${cons!==null?(cons>=8?'#5a7d63':cons>=5?'#8f7440':'#9a5750'):'#9aa39e'};font-variant-numeric:tabular-nums">${cons!==null?cons.toFixed(2)+' كم/ل':'—'}</td>
      <td>${f.station}</td>
      <td>${f.receiptImage ? `<span class="file-chip" title="${esc(f.receiptImage)}">${icon('image',11)}</span>` : '—'}</td>
      <td class="actions">${isAdmin()?`<button class="icon-btn danger" onclick="window.deleteFuel('${f.id}')">${icon('trash',14)}</button>`:''}</td>
    </tr>`;
  }).join('');
}

function renderFuel() {
  const f = state.data.fuel;
  const total = f.reduce((s,x) => s + Number(x.cost||0), 0);
  const liters = f.reduce((s,x) => s + Number(x.liters||0), 0);
  const month = todayISO().slice(0,7);
  const monthCost = f.filter(x => x.date.startsWith(month)).reduce((s,x) => s + Number(x.cost||0), 0);
  return `${pageHead('الوقود', `${f.length} عملية · ${fmtNum(liters)} لتر`, isAdmin()?`<button class="btn-primary-sm" onclick="window.addFuel()">${icon('plus',14)} تسجيل تزويد</button>`:'')}
    <div class="stat-grid">${stat('تكلفة الشهر', fmtNum(Math.round(monthCost)), 'درهم')}${stat('اللترات', fmtNum(liters))}${stat('الإجمالي', fmtNum(Math.round(total)), 'درهم')}</div>
    <div class="card"><div class="card-head"><div class="search-box">${icon('search',14)}<input placeholder="بحث..." value="${esc(q('fuel'))}" oninput="window.searchDo('fuel',this.value)"></div></div>
    <div style="overflow-x:auto"><table class="data-table"><thead><tr><th>المركبة</th><th>التاريخ</th><th>اللترات</th><th>السعر</th><th>التكلفة</th><th>العداد</th><th>معدل الصرف</th><th>المحطة</th><th>الإيصال</th><th></th></tr></thead><tbody id="tbody-fuel">${fuelRows()}</tbody></table></div></div>`;
}

function renderReports() {
  const start = state.reportStart || monthStart();
  const end = state.reportEnd || todayISO();
  const inRange = d => d && d >= start && d <= end;
  const fuel = state.data.fuel.filter(f => inRange(f.date));
  const maint = state.data.maintenance.filter(m => m.status === 'closed' && inRange(m.maintenanceDate));
  const viol = state.data.violations.filter(v => inRange(v.date));
  const totalFuel = fuel.reduce((s,f) => s + Number(f.cost||0), 0);
  const totalMaint = maint.reduce((s,m) => s + Number(m.cost||0), 0);
  const totalViol = viol.reduce((s,v) => s + Number(v.amount||0), 0);
  const grandTotal = totalFuel + totalMaint + totalViol;
  const perVehicle = state.data.vehicles.map(v => {
    const vFuel = fuel.filter(f => f.vehicleId === v.id).reduce((s,f) => s + Number(f.cost||0), 0);
    const vMaint = maint.filter(m => m.vehicleId === v.id).reduce((s,m) => s + Number(m.cost||0), 0);
    const vViol = viol.filter(x => x.vehicleId === v.id).reduce((s,x) => s + Number(x.amount||0), 0);
    const vDist = (() => { const vf = fuel.filter(f => f.vehicleId === v.id).sort((a,b) => a.date.localeCompare(b.date)); if (vf.length < 2) return 0; return Math.max(0, (vf[vf.length-1].odometer||0) - (vf[0].odometer||0)); })();
    const total = vFuel + vMaint + vViol;
    return { vehicle: v, vFuel, vMaint, vViol, total, distance: vDist, costPerKm: vDist > 0 ? total/vDist : 0 };
  }).sort((a,b) => b.total - a.total);
  const maxPerVehicle = Math.max(...perVehicle.map(x => x.total), 1);
  const bar = (label, value, max, cls='') => `<div class="report-bar"><div style="color:#727c77">${label}</div><div style="background:#eef0ec;border-radius:4px;overflow:hidden;height:8px"><div class="fill ${cls}" style="width:${Math.max((value/max)*100,1)}%"></div></div><div style="font-weight:600;text-align:end">${money(value)}</div></div>`;
  return `${pageHead('التقارير', `من ${fmtDate(start)} إلى ${fmtDate(end)}`, `<button class="btn-ghost" onclick="window.exportReportCSV()">${icon('download',14)} تصدير CSV</button>`)}
    <div class="card"><div class="card-head"><h3>الفترة</h3></div><div class="card-body"><div class="report-filter">
      <label class="field"><label>من</label><input type="date" value="${start}" onchange="window.reportDate('start',this.value)"></label>
      <label class="field"><label>إلى</label><input type="date" value="${end}" onchange="window.reportDate('end',this.value)"></label>
    </div></div></div>
    <div class="stat-grid">${stat('وقود', fmtNum(Math.round(totalFuel)), 'درهم')}${stat('صيانة', fmtNum(Math.round(totalMaint)), 'درهم')}${stat('مخالفات', fmtNum(Math.round(totalViol)), 'درهم')}${stat('الإجمالي', fmtNum(Math.round(grandTotal)), 'درهم')}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div class="card"><div class="card-head"><h3>توزيع التكاليف</h3></div><div class="card-body"><div class="report-bars">${bar('وقود', totalFuel, Math.max(totalFuel, totalMaint, totalViol, 1))}${bar('صيانة', totalMaint, Math.max(totalFuel, totalMaint, totalViol, 1), 'amber')}${bar('مخالفات', totalViol, Math.max(totalFuel, totalMaint, totalViol, 1), 'red')}</div></div></div>
      <div class="card"><div class="card-head"><h3>أعلى 5</h3></div><div class="card-body"><div class="report-bars">${perVehicle.slice(0,5).map(x => bar(x.vehicle.plate, x.total, maxPerVehicle)).join('')}</div></div></div>
    </div>
    <div class="card"><div class="card-head"><h3>تفاصيل كل مركبة</h3></div>
    <div style="overflow-x:auto"><table class="data-table"><thead><tr><th>المركبة</th><th>وقود</th><th>صيانة</th><th>مخالفات</th><th>الإجمالي</th><th>المسافة</th><th>تكلفة/كم</th></tr></thead><tbody>
      ${perVehicle.map(x => `<tr class="clickable" onclick="window.openVehicle('${x.vehicle.id}')"><td><div style="font-weight:600">${x.vehicle.make} ${x.vehicle.model}</div><div style="color:#727c77;font-size:12px">${x.vehicle.plate}</div></td><td>${money(x.vFuel)}</td><td>${money(x.vMaint)}</td><td style="color:${x.vViol>0?'#9a5750':'inherit'}">${money(x.vViol)}</td><td style="font-weight:600">${money(x.total)}</td><td>${x.distance > 0 ? fmtNum(x.distance) + ' كم' : '—'}</td><td>${x.costPerKm > 0 ? x.costPerKm.toFixed(2) : '—'}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}

function renderUsers() {

async function loadUsersTable() {
  if (!isAdmin()) return;
  const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
  const container = document.getElementById('usersContainer');
  if (!container) return;
  if (error) {
    container.innerHTML = `<div class="card"><div class="card-body" style="padding:40px;text-align:center;color:#9a5750">${esc(error.message)}</div></div>`;
    return;

  const users = data || [];
  const admins = users.filter(u => u.role === 'admin').length;
  const myEmail = currentUser?.email;
  const rows = users.length ? users.map(u => {

    return `<tr>

      <td class="actions">${isMe ? '<span style="color:#9aa39e;font-size:11.5px">(أنت)</span>' : `<button class="icon-btn" onclick="window.toggleRole('${u.id}','${u.role}')" title="تبديل الدور">${icon('user',14)}</button>`}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="4" style="text-align:center;padding:30px;color:#727c77">لا يوجد مستخدمون</td></tr>`;
  container.innerHTML = `${pageHead('المستخدمون', `${users.length} مستخدم · ${admins} مدير`)}
    <div class="card"><div class="card-head"><h3>قائمة المستخدمين</h3></div>
    <div style="overflow-x:auto"><table class="data-table"><thead><tr><th>المستخدم</th><th>الدور</th><th>التاريخ</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

const views = {
  dashboard: renderDashboard, vehicles: renderVehicles,
  'vehicle-detail': renderVehicleDetail,
  maintenance: renderMaintenance, tracking: renderTracking,
  tasks: renderTasks, requests: renderRequests,
  violations: renderViolations, documents: renderDocuments,
  fuel: renderFuel, reports: renderReports, users: renderUsers
};
const bodyRenderers = {
  vehicles: vehicleRows, drivers: driverRows, maintenance: maintenanceRows,
  tasks: taskRows, requests: requestRows, violations: violationRows,
  documents: documentRows, fuel: fuelRows
};

async function render() {
  if (!currentProfile) return;
  if (state.view !== 'vehicle-detail' && !allowedView(state.view)) state.view = 'vehicles';
  renderNav();
  try {
    const fn = views[state.view] || renderVehicles;
    const html = await fn();
    const appView = $('#appView');
    if (appView) appView.innerHTML = html;
    if (state.view === 'users') await loadUsersTable();
  } catch (e) {
    console.error('[RENDER]', e);
    const appView = $('#appView');
    if (appView) appView.innerHTML = `<div style="padding:40px;text-align:center;color:#9a5750">خطأ: ${esc(e.message||'')}</div>`;
  }
  window.scrollTo({ top: 0 });
}

/* ═══════════════════════════════════════════════════════════════
   🌐 Window handlers
   ═══════════════════════════════════════════════════════════════ */
window.closeModal = closeModal;
window.doSignOut = doSignOut;
window.navTo = v => { if (!allowedView(v)) return; state.view = v; render(); };
window.searchDo = (view, value) => {
  state.search[view] = value;
  const fn = bodyRenderers[view];
  const tbody = document.getElementById('tbody-' + view);
  if (fn && tbody) tbody.innerHTML = fn();
};
window.openVehicle = id => { state.selectedVehicleId = id; state.detailTab = 'overview'; state.view = 'vehicle-detail'; render(); };
window.detailTab = t => { state.detailTab = t; render(); };
window.violFilter = (k, v) => { state.violationsFilter[k] = v; render(); };
window.reportDate = (k, v) => { if (k === 'start') state.reportStart = v; else state.reportEnd = v; render(); };
window.exportReportCSV = () => {
  const start = state.reportStart || monthStart(), end = state.reportEnd || todayISO();
  const fuel = state.data.fuel.filter(f => f.date >= start && f.date <= end);
  const maint = state.data.maintenance.filter(m => m.status === 'closed' && m.maintenanceDate >= start && m.maintenanceDate <= end);
  const viol = state.data.violations.filter(v => v.date >= start && v.date <= end);
  const rows = state.data.vehicles.map(v => {
    const vF = fuel.filter(f => f.vehicleId === v.id).reduce((s,f) => s + Number(f.cost||0), 0);
    const vM = maint.filter(m => m.vehicleId === v.id).reduce((s,m) => s + Number(m.cost||0), 0);
    const vV = viol.filter(x => x.vehicleId === v.id).reduce((s,x) => s + Number(x.amount||0), 0);
    return [v.plate, v.make + ' ' + v.model, vF, vM, vV, vF+vM+vV];
  });
  exportCSV(`report-${start}-to-${end}.csv`, ['اللوحة','المركبة','وقود','صيانة','مخالفات','الإجمالي'], rows);
};

window.toggleRole = async (id, cur) => {

};

window.simulateTracking = async () => {
  const places = [
    { name:'شارع الشيخ زايد — دبي', lat:25.2048, lng:55.2708, zone:null },
    { name:'طريق الإمارات — دبي', lat:25.2048, lng:55.2708, zone:null },
    { name:'الكورنيش — أبوظبي', lat:24.4539, lng:54.3773, zone:null },
    { name:'مطار دبي الدولي', lat:25.2532, lng:55.3657, zone:'airport' },
    { name:'مول الإمارات', lat:25.1181, lng:55.2003, zone:'mall' }
  ];
  const now = new Date().toISOString();
  try {
    for (const t of state.data.tracking) {
      const p = places[Math.floor(Math.random()*places.length)];
      const speed = t.status === 'moving' ? clamp(Math.round(40+Math.random()*80), 20, 120) : 0;
      const u = { location:p.name, lat:p.lat, lng:p.lng, zone:p.zone, speed, at:now, parkedSince:p.zone?now:null };
      await sbUpdate('tracking', t.id, u);
      Object.assign(t, u);
      const logRec = { id:uid('l'), vehicleId:t.vehicleId, location:p.name, speed, status:t.status, at:now };
      await sbInsert('trackingLog', logRec);
      state.data.trackingLog.unshift(logRec);
    }
    toast('تم'); await render();
  } catch(e) { toast(e.message,'red'); }
};

/* ═══════════════════════════════════════════════════════════════
   🚀 Init
   ═══════════════════════════════════════════════════════════════ */
function attachAuthListeners() {
  // Initialize Supabase
  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    showAuthError('مكتبة Supabase لم تُحمّل. تحقق من اتصال الإنترنت.');
    return;
  }
  if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('YOUR_ANON')) {
    showAuthError('⚠️ لم يتم تعيين SUPABASE_ANON_KEY. عدّل الكود وأضف مفتاحك من Supabase.');
    return;
  }
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch(e) {
    showAuthError('خطأ في تهيئة Supabase: ' + e.message);
    return;
  }

  // Render logos
  const authLogo = $('#authLogo'); if (authLogo) authLogo.innerHTML = renderLogo('lg');
  const headerLogo = $('#headerLogo'); if (headerLogo) headerLogo.innerHTML = renderLogo('md');

  // Wire auth buttons
  const submit = $('#authSubmit');
  if (submit) submit.addEventListener('click', doAuth);
  const switchLink = $('#authSwitchLink');
  if (switchLink) switchLink.addEventListener('click', e => { e.preventDefault(); switchAuthMode(authMode === 'signin' ? 'signup' : 'signin'); });

  ['authEmail','authPassword','authName'].forEach(id => {
    const el = $('#'+id);
    if (!el) return;
    el.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (id === 'authEmail') $('#authPassword')?.focus();
      else doAuth();
    });
  });

  // Listen for auth state changes
  sb.auth.onAuthStateChange((event, session) => {
    console.log('[AUTH STATE]', event);
    if (event === 'SIGNED_OUT' || !session) {
      currentUser = null; currentProfile = null;
      showAuthScreen();
    } else if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') {
      if (!currentUser || currentUser.id !== session.user.id) {
        handleSession(session).catch(e => {
          console.error('[HANDLE SESSION]', e);
          showAuthError('فشل تحميل الجلسة: ' + e.message);
        });
      }
    }
  });

  // Check existing session
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) {
      handleSession(session).catch(e => {
        console.error('[INIT SESSION]', e);
        showAuthError('فشل استعادة الجلسة: ' + e.message);
      });
    } else {
      showAuthScreen();
    }
  }).catch(e => {
    showAuthError('فشل الاتصال بـ Supabase: ' + e.message);
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', attachAuthListeners);
} else {
  attachAuthListeners();
}

})();
</script>
