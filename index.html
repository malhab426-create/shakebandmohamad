<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أسطول — Fleet Management</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f4f5f3;color:#2c3531;font-size:15px;line-height:1.7}
html[dir="rtl"] body{font-family:'Tajawal',system-ui,sans-serif}
html[dir="ltr"] body{font-family:'Inter',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
input,select,textarea{font-family:inherit;font-size:13.5px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#4a6b5f!important;box-shadow:0 0 0 3px rgba(74,107,95,.12)}
.hidden{display:none!important}
.ico{display:inline-block;vertical-align:middle;flex:0 0 auto}

#authScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#eef2ef 0%,#f4f5f3 70%);z-index:1000;padding:20px;overflow-y:auto}
.auth-card{background:#fff;border:1px solid #e6e8e4;border-radius:14px;padding:30px;width:100%;max-width:440px;box-shadow:0 20px 50px -25px rgba(38,49,45,.3);position:relative}
.lang-btn{position:absolute;top:14px;inset-inline-end:14px;background:#f0f3ef;border:1px solid #e6e8e4;border-radius:7px;padding:5px 12px;font-size:12px;color:#4a6b5f;font-weight:600;cursor:pointer}
.lang-btn:hover{background:#e8ede9}
.auth-logo{margin-bottom:24px;display:flex;justify-content:center}
.auth-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.auth-subtitle{font-size:13px;color:#727c77;text-align:center;margin-bottom:24px}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:12.5px;color:#727c77;margin-bottom:5px;font-weight:500}
.auth-field input{width:100%;border:1px solid #e6e8e4;border-radius:8px;padding:10px 12px;font-size:14px;background:#fff;color:#2c3531}
#authError{display:none;background:#fdecea;color:#9a5750;border:1px solid #f5c6cb;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px;line-height:1.6;white-space:pre-line}
#authDiag{font-size:12.5px;margin-bottom:14px}
.auth-btn{width:100%;border:0;border-radius:8px;padding:12px;font-size:15px;font-weight:500;background:#4a6b5f;color:#fff;transition:background .15s}
.auth-btn:hover:not(:disabled){background:#3a564b}
.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.auth-switch{text-align:center;margin-top:16px;font-size:13px;color:#727c77}
.auth-switch a{color:#4a6b5f;cursor:pointer;text-decoration:underline;font-weight:500}

.app-header{background:#26312d;color:#e8ede9;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.app-header .brand{display:flex;align-items:center;gap:12px}
.app-nav{background:#2a3631;padding:8px 20px;display:flex;gap:4px;flex-wrap:wrap;overflow-x:auto}
.nav-btn{background:transparent;color:#9aa8a2;border:0;padding:8px 14px;border-radius:7px;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.nav-btn:hover{background:rgba(255,255,255,.05);color:#e8ede9}
.nav-btn.active{background:rgba(255,255,255,.12);color:#fff;font-weight:500}
.nav-badge{background:#9a5750;color:#fff;border-radius:10px;padding:1px 6px;font-size:10.5px;font-weight:600;margin-inline-start:4px}
.app-main{padding:24px 32px;max-width:1400px;margin:0 auto}
@media (max-width:1024px){.app-main{padding:20px 16px}}

.user-info{display:flex;align-items:center;gap:12px;font-size:13px}
.user-info .name{font-weight:600;color:#fff}
.user-info .role{font-size:11px;color:#829588}
.signout-btn,.lang-toggle{background:transparent;border:1px solid rgba(255,255,255,.15);color:#dfe8e3;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer}
.signout-btn:hover,.lang-toggle:hover{background:rgba(255,255,255,.06)}
.lang-toggle{font-weight:600;min-width:42px}

.card{background:#fff;border:1px solid #e6e8e4;border-radius:10px;overflow:hidden;margin-bottom:20px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid #eef0ec}
.card-head h3{font-size:14px;font-weight:600}
.card-body{padding:20px}
.data-table{width:100%;border-collapse:collapse;font-size:13.5px}
.data-table th{text-align:start;font-weight:500;color:#727c77;font-size:12px;padding:10px 18px;border-bottom:1px solid #e6e8e4;background:#fafbf9;white-space:nowrap}
.data-table td{padding:14px 18px;border-bottom:1px solid #eef0ec;vertical-align:middle}
.data-table tr:last-child td{border-bottom:0}
.data-table tr.clickable{cursor:pointer}
.data-table tr.clickable:hover{background:#fafbf9}
.data-table td.actions{white-space:nowrap;text-align:end}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:#e6e8e4;border:1px solid #e6e8e4;border-radius:10px;overflow:hidden;margin-bottom:24px}
.stat{background:#fff;padding:18px 22px}
.stat-label{font-size:12px;color:#727c77}
.stat-value{font-size:25px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.stat-sub{font-size:11.5px;color:#9aa39e;margin-top:2px}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}

.search-box{display:flex;align-items:center;gap:8px;background:#fafbf9;border:1px solid #e6e8e4;border-radius:8px;padding:6px 11px;max-width:360px;flex:1;min-width:200px;color:#727c77}
.search-box input{border:0;background:transparent;outline:none;font-size:13.5px;width:100%;color:#2c3531}

.fuel-bar{display:flex;align-items:center;gap:8px;min-width:110px}
.fuel-track{flex:1;height:4px;border-radius:99px;background:#e8ebe7;overflow:hidden}
.fuel-fill{height:100%;border-radius:99px}

.modal-backdrop{position:fixed;inset:0;background:rgba(38,49,45,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;box-shadow:0 20px 50px -25px rgba(38,49,45,.5);display:flex;flex-direction:column;max-height:90vh}
.modal.lg{max-width:900px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:1px solid #eef0ec}
.modal-head h3{font-size:15.5px;font-weight:600}
.modal-head .sub{font-size:12.5px;color:#727c77;margin-top:2px}
.modal-body{padding:20px 22px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid #eef0ec;background:#fafbf9;border-radius:0 0 12px 12px;flex-wrap:wrap}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid-2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.field label{color:#727c77;font-weight:500}
.field input,.field select,.field textarea{border:1px solid #e6e8e4;border-radius:8px;padding:8px 11px;font-size:13.5px;background:#fff;width:100%;color:#2c3531}
.field input[readonly]{background:#f7f8f6;color:#727c77}
.field textarea{resize:vertical;min-height:70px}
.field em{color:#9a5750;font-style:normal}
.field input.invalid,.field select.invalid,.field textarea.invalid{border-color:#9a5750!important;background:#fdf8f7}
.full{grid-column:1/-1}
.form-section{margin-top:20px;padding-top:16px;border-top:1px solid #eef0ec}
.form-section:first-child{margin-top:0;padding-top:0;border-top:0}
.form-section h4{font-size:13px;font-weight:600;margin-bottom:12px;color:#2c3531;display:flex;align-items:center;gap:8px}
.banner{background:#fafbf9;border:1px solid #e6e8e4;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:#727c77}
.banner strong{color:#2c3531}
.radio-row{display:flex;gap:22px;margin-bottom:12px}
.radio-row label{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;cursor:pointer;color:#2c3531}
.radio-row input{accent-color:#4a6b5f}
.checkbox-field{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.7;color:#727c77;cursor:pointer;background:#fafbf9;border:1px solid #e6e8e4;border-radius:8px;padding:12px 14px}
.checkbox-field input{margin-top:3px;accent-color:#4a6b5f;flex:0 0 auto}
.checkbox-field.invalid{border-color:#9a5750;background:#fdf8f7}

.items-wrap{border:1px solid #e6e8e4;border-radius:8px;overflow:hidden}
.items-table{width:100%;border-collapse:collapse;font-size:13px}
.items-table th{padding:8px 10px;font-size:11.5px;background:#fafbf9;text-align:start;font-weight:500;color:#727c77;border-bottom:1px solid #e6e8e4;white-space:nowrap}
.items-table td{padding:6px 10px;border-bottom:1px solid #eef0ec}
.items-table input{border:1px solid #e6e8e4;border-radius:6px;padding:5px 8px;font-size:13px;width:100%;background:#fff}
.items-table .item-price,.items-table .item-qty,.items-table .item-disc{width:90px}
.items-table .item-desc{min-width:150px}
.items-table .item-total{font-variant-numeric:tabular-nums;font-weight:500;color:#727c77;text-align:center}
.items-total{margin-top:10px;text-align:end;font-size:13.5px;color:#727c77}
.items-total strong{color:#2c3531;font-size:15px}
.items-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

.file-field{margin-bottom:14px}
.file-label{display:block;font-size:12.5px;color:#727c77;margin-bottom:5px;font-weight:500}
.file-label em{color:#9a5750;font-style:normal}
.file-label input[type=file]{display:block;margin-top:6px;font-size:12.5px;border:1px dashed #e6e8e4;border-radius:7px;padding:8px;width:100%;color:#727c77}
.file-label input[type=file].invalid{border-color:#9a5750;background:#fdf8f7}
.file-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.file-chip{display:inline-flex;align-items:center;gap:4px;background:#f3f5f2;border:1px solid #e6e8e4;border-radius:6px;padding:3px 9px;font-size:12px;color:#2c3531}
.file-chip button{background:transparent;border:0;color:#9aa39e;padding:0;margin-inline-start:2px;display:inline-flex;cursor:pointer}
.file-chip button:hover{color:#9a5750}

.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px}
.detail-grid > div > .lbl{font-size:11.5px;color:#727c77;margin-bottom:2px}

.map{position:relative;height:340px;border-radius:10px;overflow:hidden;border:1px solid #e6e8e4;background:linear-gradient(180deg,#f7f9f7,#eef2ee)}
.map::before{content:'';position:absolute;inset:0;opacity:.6;background-image:linear-gradient(#e3e8e2 1px,transparent 1px),linear-gradient(90deg,#e3e8e2 1px,transparent 1px);background-size:36px 36px}
.map-pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#4a5a53;font-weight:500}
.map-dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 3px rgba(74,107,95,.15)}

.toast-box{position:fixed;bottom:20px;inset-inline-start:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{background:#26312d;color:#e8ede9;padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 12px 28px -18px rgba(38,49,45,.7);max-width:340px;display:flex;align-items:center;gap:9px}
.toast.red{background:#7c4640}
.toast.amber{background:#7a6438}

.detail-header{background:#fff;border:1px solid #e6e8e4;border-radius:10px;padding:20px 24px;margin-bottom:16px}
.detail-title{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.detail-title .avatar{width:52px;height:52px;border-radius:12px;background:#eef2ef;color:#4a6b5f;display:grid;place-items:center;flex:0 0 auto}
.detail-title h1{font-size:22px;font-weight:700;margin:0}
.detail-title .sub{color:#727c77;font-size:13px;margin-top:2px}
.detail-tabs{display:flex;gap:4px;border-bottom:1px solid #e6e8e4;margin-top:16px;overflow-x:auto}
.detail-tab{background:transparent;border:0;padding:10px 16px;font-size:13.5px;color:#727c77;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.detail-tab:hover{color:#2c3531}
.detail-tab.active{color:#4a6b5f;border-bottom-color:#4a6b5f;font-weight:500}
.stat-mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:14px 0}
.stat-mini .item{background:#fafbf9;border:1px solid #eef0ec;border-radius:8px;padding:10px 14px}
.stat-mini .lbl{font-size:11.5px;color:#727c77}
.stat-mini .val{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}

.report-filter{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.report-bars{display:flex;flex-direction:column;gap:10px}
.report-bar{display:grid;grid-template-columns:180px 1fr 100px;gap:12px;align-items:center;font-size:13px}
.report-bar .fill{height:8px;border-radius:4px;background:#4a6b5f;opacity:.75}
.report-bar .fill.amber{background:#8f7440}
.report-bar .fill.red{background:#9a5750}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:500;background:transparent;color:#2c3531}
.btn-ghost{background:#fff;border:1px solid #e6e8e4;color:#2c3531}
.btn-ghost:hover{background:#f7f8f6}
.btn-primary-sm{background:#4a6b5f;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:13.5px}
.btn-primary-sm:hover{background:#3a564b}
.btn-sm{padding:5px 10px;font-size:12.5px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;border:0;background:transparent;color:#9aa39e;padding:0}
.icon-btn:hover{background:#eef0ec;color:#2c3531}
.icon-btn.danger:hover{background:#f6eceb;color:#9a5750}
</style>
</head>
<body>

<div id="authScreen" style="display:flex">
  <div class="auth-card">
    <button class="lang-btn" id="authLangBtn">EN</button>
    <div class="auth-logo" id="authLogo"></div>
    <h2 class="auth-title" id="authTitle"></h2>
    <p class="auth-subtitle" id="authSubtitle"></p>
    <div id="authError"></div>
    <div id="authDiag"></div>
    <div class="auth-field">
      <label id="lblEmail"></label>
      <input type="email" id="authEmail" dir="ltr" autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="auth-field">
      <label id="lblPassword"></label>
      <input type="password" id="authPassword" dir="ltr" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div class="auth-field hidden" id="authNameField">
      <label id="lblFullName"></label>
      <input type="text" id="authName">
    </div>
    <button class="auth-btn" id="authSubmit"></button>
    <div class="auth-switch">
      <span id="authSwitchText"></span>
      <a id="authSwitchLink"></a>
    </div>
  </div>
</div>

<div id="appRoot" class="hidden">
  <header class="app-header">
    <div class="brand" id="headerLogo"></div>
    <div class="user-info">
      <div style="text-align:end">
        <div class="name" id="headerUserName">—</div>
        <div class="role" id="headerUserRole">—</div>
      </div>
      <button class="lang-toggle" id="appLangBtn">EN</button>
      <button class="signout-btn" id="signoutBtn"></button>
    </div>
  </header>
  <nav class="app-nav" id="appNav"></nav>
  <main class="app-main" id="appView"></main>
</div>

<div id="modalRoot"></div>
<div id="toasts" class="toast-box"></div>

let currentLang = (function() {
  const saved = localStorage.getItem('fleet_lang');
  if (saved === 'ar' || saved === 'en') return saved;
  return (navigator.language || 'ar').startsWith('ar') ? 'ar' : 'en';
})();

function t(key, ...args) {
  let str = (I18N[currentLang] && I18N[currentLang][key]) || (I18N.ar[key]) || key;
  args.forEach((val, i) => { str = str.replace('{' + i + '}', val); });
  return str;
}

function applyDirection() {
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = currentLang;
}

function updateLangButtons() {
  const label = currentLang === 'ar' ? 'EN' : 'ع';
  const authBtn = document.getElementById('authLangBtn');
  const appBtn = document.getElementById('appLangBtn');
  if (authBtn) authBtn.textContent = label;
  if (appBtn) appBtn.textContent = label;
}

function toggleLang() {
  currentLang = currentLang === 'ar' ? 'en' : 'ar';
  localStorage.setItem('fleet_lang', currentLang);
  applyDirection();
  updateLangButtons();
  // Re-render all UI
  updateStaticTexts();
  if (currentProfile) {
    renderNav();
    render();
  } else {
    updateAuthTexts();
  }
}

function updateStaticTexts() {
  // Auth labels
  const lblEmail = document.getElementById('lblEmail'); if (lblEmail) lblEmail.textContent = t('email');
  const lblPassword = document.getElementById('lblPassword'); if (lblPassword) lblPassword.textContent = t('password');
  const lblFullName = document.getElementById('lblFullName'); if (lblFullName) lblFullName.textContent = t('full_name');
  const signoutBtn = document.getElementById('signoutBtn'); if (signoutBtn) signoutBtn.textContent = t('logout');
}

const LOGO_CONFIG = {
  imageUrl: '',
  name: 'أسطول',
  nameEn: 'Fleet',
  subtitle: 'FLEET MANAGEMENT'
};

function renderLogo(size) {
  size = size || 'md';
  const heights = { sm: 36, md: 42, lg: 48 };
  const h = heights[size] || 42;
  const name = currentLang === 'ar' ? LOGO_CONFIG.name : LOGO_CONFIG.nameEn;

  if (LOGO_CONFIG.imageUrl && LOGO_CONFIG.imageUrl.trim()) {
    return `<div style="display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#2a3631,#33423c);border-radius:10px;padding:8px 16px;min-height:${h+16}px">
      <img src="${esc(LOGO_CONFIG.imageUrl)}" alt="${esc(name)}" style="max-width:100%;max-height:${h}px;object-fit:contain;display:block">
    </div>`;
  }
  return `<div style="display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#2a3631,#33423c);border-radius:10px;padding:10px 16px;min-height:${h+10}px">
    <div style="width:${h-4}px;height:${h-4}px;border-radius:10px;background:#3f544b;color:#d7e0da;display:grid;place-items:center">
      <svg width="${h-20}" height="${h-20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="1" y="6" width="14" height="11" rx="2"/><path d="M15 9h3.5l3.5 3.5V17H15z"/><circle cx="5.5" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>
    </div>
    <div style="display:flex;flex-direction:column;line-height:1.15">
      <span style="color:#eef2ef;font-size:17px;font-weight:800">${esc(name)}</span>
      <span style="color:#829588;font-size:10px;letter-spacing:.5px">${esc(LOGO_CONFIG.subtitle)}</span>
    </div>
  </div>`;
}

async function loadAllData() {
  const tables = ['vehicles','drivers','maintenance','tracking','trackingLog','tasks','requests','documents','fuel','violations'];
  const results = await Promise.all(tables.map(t => sb.from(t).select('*')));
  const data = {};
  tables.forEach((t, i) => {
    if (results[i].error) console.warn('[LOAD ' + t + ']', results[i].error.message);
    data[t] = results[i].data || [];
  });
  return data;
}
async function sbInsert(table, record) {
  const { error } = await sb.from(table).insert(record);
  if (error) { console.error('[INSERT ' + table + ']', error); throw new Error(error.message); }
}
async function sbUpdate(table, id, updates) {
  const { error } = await sb.from(table).update(updates).eq('id', id);
  if (error) { console.error('[UPDATE ' + table + ']', error); throw new Error(error.message); }
}
async function sbDelete(table, id) {
  const { error } = await sb.from(table).delete().eq('id', id);
  if (error) { console.error('[DELETE ' + table + ']', error); throw new Error(error.message); }
}

async function fetchProfile(userId) {
  const { data, error } = await sb.from('profiles').select('*').eq('id', userId).maybeSingle();
  if (error) { console.warn('[PROFILE]', error.message); return null; }
  return data;
}

async function handleSession(session) {
  if (!session || !session.user) { showAuthScreen(); return; }
  currentUser = session.user;
  let profile = await fetchProfile(session.user.id);
  if (!profile) {
    const { data: created, error } = await sb.from('profiles').insert({
      id: session.user.id, email: session.user.email,
      full_name: session.user.user_metadata?.full_name || session.user.email, role: 'user'
    }).select().single();
    if (error) {
      console.warn('[PROFILE] create failed:', error.message);
      profile = { id: session.user.id, email: session.user.email, full_name: session.user.email, role: 'user' };
    } else { profile = created; }
  }
  currentProfile = profile;
  if (profile.role !== 'admin') {
    const email = session.user.email;
    showAuthDiag(`<div class="banner" style="background:#fff8e1;border-color:#f0d477;color:#7c5a20">
      <strong>Note:</strong> You are a regular user. If you expect admin privileges:
      <pre style="background:#fef0c0;padding:6px 10px;border-radius:5px;margin-top:6px;font-size:11px;overflow-x:auto;direction:ltr">update public.profiles set role='admin' where email='${email}';</pre>
    </div>`);
  }
  try {
    state.data = await loadAllData();
  } catch(e) { console.error(e); toast(t('error_occurred'), 'red'); }
  showAppScreen();
}

async function doAuth() {
  hideAuthError(); clearAuthDiag();
  const email = ($('#authEmail')?.value || '').trim();
  const password = $('#authPassword')?.value || '';
  const fullName = ($('#authName')?.value || '').trim();
  if (!email) { showAuthError(t('please_fill_email')); return; }
  if (!password) { showAuthError(t('please_fill_password')); return; }
  if (authMode === 'signup' && !fullName) { showAuthError(t('please_fill_name')); return; }
  if (authMode === 'signup' && password.length < 6) { showAuthError(t('password_too_short')); return; }

  const btn = $('#authSubmit');
  if (btn) { btn.disabled = true; btn.textContent = t('signing_in'); }
  try {
    if (authMode === 'signup') {
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name: fullName } } });
      if (error) throw error;
      if (data.user && !data.session) { showAuthError(t('account_created')); return; }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (e) {
    let msg = e.message || t('error_occurred');
    if (msg.includes('Invalid login credentials')) msg = t('invalid_credentials');
    else if (msg.includes('already registered')) msg = t('email_registered');
    else if (msg.includes('Email not confirmed')) msg = t('email_not_confirmed');
    showAuthError(msg);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = authMode === 'signup' ? t('create_account_btn') : t('login_btn'); }
  }
}

function computeConsumption(fuelId) {
  const current = state.data.fuel.find(f => f.id === fuelId);
  if (!current || !current.odometer || !current.liters) return null;
  const sameVehicle = state.data.fuel
    .filter(f => f.vehicleId === current.vehicleId && f.odometer > 0)
    .sort((a, b) => (a.date !== b.date) ? a.date.localeCompare(b.date) : (a.odometer||0)-(b.odometer||0));
  const idx = sameVehicle.findIndex(f => f.id === fuelId);
  if (idx <= 0) return null;
  const distance = current.odometer - sameVehicle[idx-1].odometer;
  if (distance <= 0) return null;
  return distance / current.liters;
}

function vehicleStats(vehicleId) {
  const fuel = state.data.fuel.filter(f => f.vehicleId === vehicleId);
  const maint = state.data.maintenance.filter(m => m.vehicleId === vehicleId && m.status === 'closed');
  const viol = state.data.violations.filter(v => v.vehicleId === vehicleId);
  const totalFuel = fuel.reduce((s,f) => s + Number(f.cost||0), 0);
  const totalLiters = fuel.reduce((s,f) => s + Number(f.liters||0), 0);
  const totalMaint = maint.reduce((s,m) => s + Number(m.cost||0), 0);
  const totalViol = viol.reduce((s,v) => s + Number(v.amount||0), 0);
  let distance = 0;
  if (fuel.length >= 2) {
    const sorted = [...fuel].sort((a,b) => a.date.localeCompare(b.date));
    distance = Math.max(0, (sorted[sorted.length-1].odometer||0) - (sorted[0].odometer||0));
  }
  const costPerKm = distance > 0 ? ((totalFuel + totalMaint + totalViol) / distance) : 0;
  const unpaidViol = viol.filter(v => v.status === 'unpaid').reduce((s,v) => s + Number(v.amount||0), 0);
  return { totalFuel, totalLiters, totalMaint, totalViol, totalCost: totalFuel + totalMaint + totalViol, distance, costPerKm, unpaidViol, fuelCount: fuel.length, maintCount: maint.length, violCount: viol.length };
}

function computeAlerts() {
  if (!state.data) return [];
  const { vehicles, requests, tasks, documents, drivers, violations } = state.data;
  const out = [];
  const today = todayISO();
  vehicles.forEach(v => {
    if (v.fuelLevel <= 25) out.push({ tone:'red', view:'fuel', title:`${t('fuel')} — ${v.plate}`, text:`${v.fuelLevel}%` });
    const remain = Number(v.nextServiceKm) - Number(v.odometer);
    if (v.nextServiceKm > 0 && remain <= 0) out.push({ tone:'red', view:'maintenance', title:`${t('maintenance')} — ${v.plate}`, text:`${fmtNum(v.odometer)} ${t('km')}` });
    else if (v.nextServiceKm > 0 && remain <= 1500) out.push({ tone:'amber', view:'maintenance', title:`${t('maintenance')} — ${v.plate}`, text:`${fmtNum(remain)} ${t('km')}` });
    const unpaid = violations.filter(vi => vi.vehicleId === v.id && vi.status === 'unpaid');
    if (unpaid.length) out.push({ tone:'red', view:'violations', title:`${unpaid.length} ${t('violations')} — ${v.plate}`, text:money(unpaid.reduce((s,x) => s + Number(x.amount||0), 0)) });
  });
  const pending = requests.filter(r => ['new','review','approved'].includes(r.status));
  if (pending.length) out.push({ tone:'blue', view:'requests', title:`${pending.length} ${t('pending_requests')}`, text:t('requests') });
  const overdue = tasks.filter(t => t.status === 'scheduled' && t.endDate < today);
  if (overdue.length) out.push({ tone:'amber', view:'tasks', title:`${overdue.length} ${t('tasks')}`, text:t('task_late') });
  documents.forEach(d => {
    const v = getVehicle(d.vehicleId);
    const days = daysUntil(d.expiryDate);
    if (days === null) return;
    if (days < 0) out.push({ tone:'red', view:'documents', title:`${t('documents')} — ${t('doc_expired')}`, text:v?v.plate:'' });
    else if (days <= 30) out.push({ tone:'amber', view:'documents', title:`${t('documents')} — ${t('doc_expiring')}`, text:`${v?v.plate:''} · ${days}d` });
  });
  drivers.forEach(dr => {
    if (!dr.licenseExpiry) return;
    const days = daysUntil(dr.licenseExpiry);
    if (days === null) return;
    if (days < 0) out.push({ tone:'red', view:'vehicles', title:`${t('license_expiry')} — ${dr.name}`, text:fmtDate(dr.licenseExpiry) });
    else if (days <= 30) out.push({ tone:'amber', view:'vehicles', title:`${t('license_expiry')} — ${dr.name}`, text:`${days}d` });
  });
  return out;
}

function pageHead(title, subtitle, actions) {
  return `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:24px">
    <div><h1 style="font-size:21px;font-weight:600">${title}</h1><p style="color:#727c77;font-size:13px;margin-top:3px">${subtitle}</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${actions||''}</div>
  </div>`;
}
function stat(label, value, sub) {
  return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div>${sub?`<div class="stat-sub">${sub}</div>`:''}</div>`;
}
function fuelBar(level) {
  const l = clamp(Number(level)||0, 0, 100);
  const c = l <= 25 ? '#9a5750' : l <= 50 ? '#8f7440' : '#5a7d63';
  return `<div class="fuel-bar"><div class="fuel-track"><div class="fuel-fill" style="width:${l}%;background:${c}"></div></div><span style="font-size:12px;color:#727c77">${l}%</span></div>`;
}
function field(label, name, value, opts) {
  opts = opts || {};
  const type = opts.type || 'text', required = opts.required, placeholder = opts.placeholder;
  const min = opts.min, max = opts.max, step = opts.step, readonly = opts.readonly;
  return `<label class="field"><label>${label}${required?' <em>*</em>':''}</label>
    <input type="${type}" name="${name}" value="${esc(value??'')}" ${placeholder?`placeholder="${placeholder}"`:''} ${readonly?'readonly':''} ${min!==undefined?`min="${min}"`:''} ${max!==undefined?`max="${max}"`:''} ${step!==undefined?`step="${step}"`:''}>
  </label>`;
}
function phoneField(label, name, value, opts) {
  opts = opts || {};
  return `<label class="field"><label>${label}${opts.required?' <em>*</em>':''}</label>
    <input type="tel" name="${name}" value="${esc(normalizeNumber(value))}" placeholder="05XXXXXXXX" inputmode="numeric" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
    <span style="font-size:11px;color:#9aa39e">10</span>
  </label>`;
}
function selectField(label, name, map, value) {
  const opts = Object.entries(map).map(([k,v]) => `<option value="${k}" ${k===value?'selected':''}>${t(v[0])}</option>`).join('');
  return `<label class="field"><label>${label}</label><select name="${name}">${opts}</select></label>`;
}
function textareaField(label, name, value, placeholder) {
  return `<label class="field full"><label>${label}</label><textarea name="${name}" placeholder="${placeholder||''}">${value??''}</textarea></label>`;
}
function vehicleSelect(value) {
  const opts = state.data.vehicles.map(v => `<option value="${v.id}" ${v.id===value?'selected':''}>${v.plate} — ${v.make} ${v.model}</option>`).join('');
  return `<label class="field"><label>${t('select_vehicle')} <em>*</em></label><select name="vehicleId">${opts}</select></label>`;
}
function emptyRow(cols, msg) {
  return `<tr><td colspan="${cols}" style="padding:32px 20px;text-align:center;color:#727c77;font-size:13.5px">${msg || '—'}</td></tr>`;
}

function openModal(cfg) {
  const root = $('#modalRoot'); if (!root) return;
  const btnStyle = cfg.tone === 'danger'
    ? 'background:#9a5750;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:13.5px;cursor:pointer'
    : 'background:#4a6b5f;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:13.5px;cursor:pointer';
  root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)window.closeModal()">
    <div class="modal ${cfg.size==='lg'?'lg':''}">
      <div class="modal-head">
        <div><h3>${cfg.title}</h3>${cfg.subtitle?`<div class="sub">${cfg.subtitle}</div>`:''}</div>
        <button type="button" class="icon-btn" onclick="window.closeModal()">${icon('x',18)}</button>
      </div>
      <form id="modalForm" class="modal-body" onsubmit="event.preventDefault()">${cfg.body}</form>
      <div class="modal-foot">
        ${cfg.footExtra||''}
        <button type="button" class="btn-ghost" onclick="window.closeModal()">${cfg.cancelLabel || t('cancel')}</button>
        <button type="button" id="modalSubmit" style="${btnStyle}">${cfg.submitLabel || t('save')}</button>
      </div>
    </div>
  </div>`;
  const form = $('#modalForm'); const btn = $('#modalSubmit');
  const submit = async () => {
    const fd = Object.fromEntries(new FormData(form).entries());
    if (!cfg.onSubmit) { window.closeModal(); return; }
    btn.disabled = true; const orig = btn.textContent; btn.textContent = '...';
    try { const r = await cfg.onSubmit(fd, form); if (r !== false) window.closeModal(); }
    catch (e) { console.error('[MODAL]', e); toast(e.message || t('error_occurred'), 'red'); }
    finally { btn.disabled = false; btn.textContent = orig; }
  };
  btn.onclick = submit;
  form.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); submit(); } });
  setTimeout(() => form.querySelector('input:not([readonly]),select,textarea')?.focus(), 60);
}
function closeModal() { const r = $('#modalRoot'); if (r) r.innerHTML = ''; }
function confirmDialog(title, msg, onConfirm, label) {
  openModal({ title, body:`<p style="color:#4a544f;line-height:1.8;font-size:14px">${msg}</p>`, submitLabel:label || t('confirm'), tone:'danger', onSubmit: async () => { await onConfirm(); } });
}
function toast(msg, tone) {
  tone = tone || 'green';
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (tone === 'green' ? '' : tone);
  el.innerHTML = `${icon(tone === 'red' ? 'alert' : 'check', 15)}<span>${esc(msg)}</span>`;
  box.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function itemRowHTML(it) {
  it = it || {};
  const p = it.price ?? 0, qty = it.qty ?? 1, d = it.discount ?? 0;
  const total = Math.max(0, p*qty - d);
  return `<tr class="item-row">
    <td><input type="text" class="item-desc" value="${esc(it.description||'')}"></td>
    <td><input type="number" class="item-price" value="${p}" min="0" step="0.01"></td>
    <td><input type="number" class="item-qty" value="${qty}" min="1"></td>
    <td class="item-total">${total.toFixed(2)}</td>
    <td><input type="number" class="item-disc" value="${d}" min="0" step="0.01"></td>
    <td><button type="button" class="icon-btn danger item-remove">${icon('trash',13)}</button></td>
  </tr>`;
}
function initItemsBlock(form) {
  const body = form.querySelector('#itemsBody');
  const addBtn = form.querySelector('#addItemBtn');
  if (!body || !addBtn) return;
  const recalc = () => {
    const el = form.querySelector('#itemsGrandTotal');
    if (!el) return;
    let g = 0;
    form.querySelectorAll('.item-row').forEach(row => {
      const p = parseFloat(row.querySelector('.item-price').value) || 0;
      const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
      const d = parseFloat(row.querySelector('.item-disc').value) || 0;
      const tot = Math.max(0, p*qty - d);
      row.querySelector('.item-total').textContent = tot.toFixed(2);
      g += tot;
    });
    el.textContent = g.toFixed(2) + ' ' + t('currency');
  };
  addBtn.onclick = () => { body.insertAdjacentHTML('beforeend', itemRowHTML({})); recalc(); };
  body.addEventListener('click', e => { const b = e.target.closest('.item-remove'); if (b) { b.closest('.item-row').remove(); recalc(); } });
  body.addEventListener('input', recalc);
  recalc();
}
function collectItems(form) {
  return [...form.querySelectorAll('.item-row')].map(row => ({
    description: row.querySelector('.item-desc').value.trim(),
    price: parseFloat(row.querySelector('.item-price').value) || 0,
    qty: parseFloat(row.querySelector('.item-qty').value) || 0,
    discount: parseFloat(row.querySelector('.item-disc').value) || 0
  })).filter(it => it.description || it.price > 0);
}
function fileFieldHTML(label, key, existing, required) {
  const list = Array.isArray(existing) ? existing : [];
  return `<div class="file-field"><label class="file-label">${label}${required?' <em>*</em>':''}<input type="file" accept="image/*,.pdf" multiple data-attach="${key}"></label><div class="file-list" data-filelist="${key}">${list.map(f => `<span class="file-chip">${esc(f)}<button type="button" data-rm-file="${key}">${icon('x',12)}</button></span>`).join('')}</div></div>`;
}
function singleFileFieldHTML(label, key, existing, required) {
  return `<div class="file-field"><label class="file-label">${label}${required?' <em>*</em>':''}<input type="file" accept="image/*" data-single="${key}"></label><div class="file-list" data-filelist="${key}">${existing ? `<span class="file-chip">${esc(existing)}<button type="button" data-rm-file="${key}">${icon('x',12)}</button></span>` : ''}</div></div>`;
}
function initFileUploads(form) {
  form.querySelectorAll('input[type=file][data-attach]').forEach(inp => {
    inp.addEventListener('change', () => {
      const key = inp.dataset.attach;
      const list = form.querySelector(`[data-filelist="${key}"]`);
      [...inp.files].forEach(f => {
        const chip = document.createElement('span');
        chip.className = 'file-chip';
        chip.innerHTML = `${esc(f.name)}<button type="button" data-rm-file="${key}">${icon('x',12)}</button>`;
        list.appendChild(chip);
      });
      inp.value = ''; inp.classList.remove('invalid');
    });
  });
  form.querySelectorAll('input[type=file][data-single]').forEach(inp => {
    inp.addEventListener('change', () => {
      const key = inp.dataset.single;
      const list = form.querySelector(`[data-filelist="${key}"]`);
      list.innerHTML = '';
      if (inp.files[0]) {
        const chip = document.createElement('span');
        chip.className = 'file-chip';
        chip.innerHTML = `${esc(inp.files[0].name)}<button type="button" data-rm-file="${key}">${icon('x',12)}</button>`;
        list.appendChild(chip);
      }
      inp.value = ''; inp.classList.remove('invalid');
    });
  });
  form.addEventListener('click', e => { const rm = e.target.closest('[data-rm-file]'); if (rm) rm.closest('.file-chip').remove(); });
}
function validateFiles(form, key, min) {
  const count = form.querySelectorAll(`[data-filelist="${key}"] .file-chip`).length;
  if (count < min) { const inp = form.querySelector(`[data-attach="${key}"], [data-single="${key}"]`); if (inp) inp.classList.add('invalid'); return false; }
  return true;
}
function collectFiles(form) {
  const out = {};
  form.querySelectorAll('[data-filelist]').forEach(list => {
    out[list.dataset.filelist] = [...list.querySelectorAll('.file-chip')].map(c => { const btn = c.querySelector('button'); if (btn) btn.remove(); return c.textContent.trim(); });
  });
  return out;
}
function collectSingleFile(form, key) {
  const files = collectFiles(form);
  return (files[key] && files[key][0]) || '';
}

function exportCSV(filename, headers, rows) {
  const escape = v => { const s = String(v ?? ''); if (s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g,'""') + '"'; return s; };
  const csv = '\uFEFF' + [headers.map(escape).join(','), ...rows.map(r => r.map(escape).join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  toast(t('saved') + ': ' + filename);
}

function maintenanceRows() {
  const s = q('maintenance');
  const list = state.data.maintenance.filter(m => matchAny(s, m.requestNo, m.garageName, m.garageContactName, vehicleLabel(m.vehicleId))).sort((a,b) => (b.maintenanceDate||'').localeCompare(a.maintenanceDate||''));
  if (!list.length) return emptyRow(8, t('none'));
  return list.map(m => {
    const v = getVehicle(m.vehicleId);
    return `<tr>
      <td style="font-weight:600;font-family:monospace">${m.requestNo||'—'}</td>
      <td><div style="font-weight:600">${v?v.make+' '+v.model:'—'}</div><div style="color:#727c77;font-size:12px">${v?v.plate:''}</div></td>
      <td>${m.garageName||'—'}</td>
      <td>${fmtDate(m.maintenanceDate)}</td>
      <td>${tag(MAINT_TYPE, m.maintenanceType)}</td>
      <td style="font-weight:600">${money(m.cost)}</td>
      <td>${tag(MAINT_STATUS, m.status)}</td>
      <td class="actions">
        <button class="icon-btn" onclick="window.viewMaint('${m.id}')" title="${t('view')}">${icon('eye',14)}</button>
        ${m.status==='open'?`<button class="icon-btn" onclick="window.closeMaint('${m.id}')" title="${t('close')}">${icon('check',14)}</button>`:''}
        ${isAdmin()&&m.status==='open'?`<button class="icon-btn" onclick="window.editMaint('${m.id}')">${icon('edit',14)}</button>`:''}
        ${isAdmin()?`<button class="icon-btn danger" onclick="window.deleteMaint('${m.id}')">${icon('trash',14)}</button>`:''}
      </td>
    </tr>`;
  }).join('');
}

function renderMaintenance() {
  const open = state.data.maintenance.filter(m => m.status === 'open').length;
  const closed = state.data.maintenance.filter(m => m.status === 'closed').length;
  const cost = state.data.maintenance.reduce((s,m) => s + Number(m.cost||0), 0);
  return pageHead(t('maintenance_title'), t('maintenance_sub', state.data.maintenance.length, open, closed, money(cost)),
    `<button class="btn-primary-sm" onclick="window.addMaint()">${icon('plus',14)} ${t('add_maintenance')}</button>`) + `
    <div class="stat-grid">${stat(t('open'), open)}${stat(t('closed'), closed)}${stat(t('total_label'), fmtNum(Math.round(cost)), t('currency'))}</div>
    <div class="card"><div class="card-head">
      <div class="search-box">${icon('search',14)}<input placeholder="${t('search_maintenance')}" value="${esc(q('maintenance'))}" oninput="window.searchDo('maintenance',this.value)"></div>
    </div>
    <div style="overflow-x:auto"><table class="data-table"><thead><tr><th>${t('request_no')}</th><th>${t('vehicle')}</th><th>${t('garage')}</th><th>${t('date')}</th><th>${t('maintenance_type')}</th><th>${t('cost')}</th><th>${t('status')}</th><th></th></tr></thead><tbody id="tbody-maintenance">${maintenanceRows()}</tbody></table></div></div>`;
}

/* ═══════════════════════════════════════════════════════════════
   📊 Views — Fuel
   ═══════════════════════════════════════════════════════════════ */
function fuelRows() {
  const s = q('fuel');
  const list = state.data.fuel.filter(f => matchAny(s, f.station, vehicleLabel(f.vehicleId))).sort((a,b) => b.date.localeCompare(a.date));
  if (!list.length) return emptyRow(10, t('none'));
  return list.map(f => {
    const v = getVehicle(f.vehicleId);
    const cons = computeConsumption(f.id);
    return `<tr>
      <td><div style="font-weight:600">${v?v.make+' '+v.model:'—'}</div><div style="color:#727c77;font-size:12px">${v?v.plate:''}</div></td>
      <td>${fmtDate(f.date)}</td>
      <td>${fmtNum(f.liters)} ${t('liter')}</td>
      <td>${f.pricePerLiter} ${t('currency')}</td>
      <td style="font-weight:600">${money(f.cost)}</td>
      <td>${fmtNum(f.odometer)} ${t('km')}</td>
      <td style="font-weight:600;color:${cons!==null?(cons>=8?'#5a7d63':cons>=5?'#8f7440':'#9a5750'):'#9aa39e'};font-variant-numeric:tabular-nums">${cons!==null?cons.toFixed(2)+' '+t('km_per_liter'):'—'}</td>
      <td>${f.station}</td>
      <td>${f.receiptImage ? `<span class="file-chip" title="${esc(f.receiptImage)}">${icon('image',11)}</span>` : '—'}</td>
      <td class="actions">${isAdmin()?`<button class="icon-btn danger" onclick="window.deleteFuel('${f.id}')">${icon('trash',14)}</button>`:''}</td>
    </tr>`;
  }).join('');
}

function renderFuel() {
  const f = state.data.fuel;
  const total = f.reduce((s,x) => s + Number(x.cost||0), 0);
  const liters = f.reduce((s,x) => s + Number(x.liters||0), 0);
  const month = todayISO().slice(0,7);
  const monthCost = f.filter(x => x.date.startsWith(month)).reduce((s,x) => s + Number(x.cost||0), 0);
  return pageHead(t('fuel_title'), t('fuel_sub', f.length, fmtNum(liters)),
    isAdmin()?`<button class="btn-primary-sm" onclick="window.addFuel()">${icon('plus',14)} ${t('add_fuel')}</button>`:'') + `
    <div class="stat-grid">${stat(t('fuel_month_cost'), fmtNum(Math.round(monthCost)), t('currency'))}${stat(t('fuel_liters'), fmtNum(liters))}${stat(t('fuel_total'), fmtNum(Math.round(total)), t('currency'))}</div>
    <div class="card"><div class="card-head"><div class="search-box">${icon('search',14)}<input placeholder="${t('search')}..." value="${esc(q('fuel'))}" oninput="window.searchDo('fuel',this.value)"></div></div>
    <div style="overflow-x:auto"><table class="data-table"><thead><tr><th>${t('vehicle')}</th><th>${t('date')}</th><th>${t('fuel_liters')}</th><th>${t('fuel_price_per_liter')}</th><th>${t('fuel_cost')}</th><th>${t('odometer')}</th><th>${t('consumption_rate')}</th><th>${t('station')}</th><th>${t('receipt')}</th><th></th></tr></thead><tbody id="tbody-fuel">${fuelRows()}</tbody></table></div></div>`;
}



/* ═══════════════════════════════════════════════════════════════
   🎯 Router
   ═══════════════════════════════════════════════════════════════ */
const views = {
  dashboard: renderDashboard, vehicles: renderVehicles,
  'vehicle-detail': renderVehicleDetail,
  maintenance: renderMaintenance, tracking: renderTracking,
  tasks: renderTasks, requests: renderRequests,
  violations: renderViolations, documents: renderDocuments,
  fuel: renderFuel, reports: renderReports, users: renderUsers
};
  

async function render() {
  if (!currentProfile) return;
  if (state.view !== 'vehicle-detail' && !allowedView(state.view)) state.view = 'vehicles';
  renderNav();
  try {
    const fn = views[state.view] || renderVehicles;
    const html = await fn();
    const appView = $('#appView');
    if (appView) appView.innerHTML = html;
  } catch (e) {
    console.error('[RENDER]', e);
    const appView = $('#appView');
    if (appView) appView.innerHTML = `<div style="padding:40px;text-align:center;color:#9a5750">${t('error_occurred')}: ${esc(e.message||'')}</div>`;
  }
  window.scrollTo({ top: 0 });
}

window.addVehicle = () => {
  if (!isAdmin()) return toast(t('not_authorized'),'red');
  openModal({ title:t('add_vehicle'), body: vehicleForm(), submitLabel:t('add'), onSubmit: async fd => {

    const rec = { id:uid('v'), make:fd.make.trim(), model:fd.model.trim(), plate:fd.plate.trim(), year:+fd.year||new Date().getFullYear(), type:fd.type?.trim()||'—', driver:fd.driver?.trim()||'—', odometer:+fd.odometer||0, tank:+fd.tank||70, fuelLevel:clamp(+fd.fuelLevel||0,0,100), nextServiceKm:+fd.nextServiceKm||0, status:fd.status||'active', createdAt: todayISO() };
    try { await sbInsert('vehicles', rec); state.data.vehicles.push(rec); toast(t('added')); await render(); }
    catch(e) { toast(e.message,'red'); return false; }
  }});
};
window.editVehicle = id => {
  if (!isAdmin()) return toast(t('not_authorized'),'red');
  const v = state.data.vehicles.find(x=>x.id===id); if (!v) return;
  openModal({ title:t('edit'), body: vehicleForm(v), submitLabel:t('save'), onSubmit: async fd => {
    const u = { make:fd.make.trim(), model:fd.model.trim(), plate:fd.plate.trim(), year:+fd.year||2024, type:fd.type?.trim()||'—', driver:fd.driver?.trim()||'—', odometer:+fd.odometer||0, tank:+fd.tank||70, fuelLevel:clamp(+fd.fuelLevel||0,0,100), nextServiceKm:+fd.nextServiceKm||0, status:fd.status||'active' };

    catch(e) { toast(e.message,'red'); return false; }

};
window.deleteVehicle = id => {
  if (!isAdmin()) return toast(t('not_authorized'),'red');
  confirmDialog(t('delete'), t('confirm_delete'), async () => {
    try { await sbDelete('vehicles', id); state.data.vehicles = state.data.vehicles.filter(x=>x.id!==id); toast(t('deleted'),'red'); await render(); }

};

function attachAuthListeners() {
  applyDirection();
  updateLangButtons();
  updateAuthTexts();

  // Logo
  const authLogo = $('#authLogo'); if (authLogo) authLogo.innerHTML = renderLogo('lg');
  const headerLogo = $('#headerLogo'); if (headerLogo) headerLogo.innerHTML = renderLogo('md');

  // Supabase
  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    showAuthError('Supabase library not loaded. Check your internet connection.');
    return;
  }
  if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('YOUR_ANON')) {
    showAuthError('⚠️ Set SUPABASE_ANON_KEY in the code first.');
    return;
  }
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch(e) {
    showAuthError('Supabase init error: ' + e.message);
    return;
  }

  // Language toggle buttons
  const authLangBtn = $('#authLangBtn'); if (authLangBtn) authLangBtn.addEventListener('click', toggleLang);
  const appLangBtn = $('#appLangBtn'); if (appLangBtn) appLangBtn.addEventListener('click', toggleLang);
  const signoutBtn = $('#signoutBtn'); if (signoutBtn) signoutBtn.addEventListener('click', doSignOut);

  // Auth submit
  const submit = $('#authSubmit');
  if (submit) submit.addEventListener('click', doAuth);
  const switchLink = $('#authSwitchLink');
  if (switchLink) switchLink.addEventListener('click', e => { e.preventDefault(); switchAuthMode(authMode === 'signin' ? 'signup' : 'signin'); });

  ['authEmail','authPassword','authName'].forEach(id => {
    const el = $('#'+id);
    if (!el) return;
    el.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (id === 'authEmail') $('#authPassword')?.focus();
      else doAuth();
    });
  });

  // Auth state
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT' || !session) {
      currentUser = null; currentProfile = null;
      showAuthScreen();
    } else if (['SIGNED_IN','INITIAL_SESSION','TOKEN_REFRESHED'].includes(event)) {
      if (!currentUser || currentUser.id !== session.user.id) {
        handleSession(session).catch(e => {
          console.error('[HANDLE SESSION]', e);
          showAuthError('Failed: ' + e.message);
        });
      }
    }
  });

  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) handleSession(session).catch(e => showAuthError('Failed: ' + e.message));
    else showAuthScreen();
  }).catch(e => showAuthError('Connection failed: ' + e.message));
}

function renderTracking() {
  const d = state.data;
  const spots = [{top:'26%',left:'24%'},{top:'54%',left:'40%'},{top:'36%',left:'66%'},{top:'70%',left:'74%'},{top:'20%',left:'82%'},{top:'76%',left:'28%'}];
  const pins = d.tracking.map((t,i) => {
    const s = spots[i%6]; const v = getVehicle(t.vehicleId);
    const color = t.zone ? '#8f7440' : t.status === 'moving' ? '#5a7d63' : '#727c77';
    return `<div class="map-pin" style="top:${s.top};left:${s.left}"><div class="map-dot" style="background:${color}"></div><span>${v?v.plate:'—'}</span></div>`;
  }).join('');
  const live = d.tracking.map(t2 => `<div style="display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #eef0ec"><div style="flex:1"><div style="font-weight:600">${vehicleLabel(t2.vehicleId)}</div><div style="color:#727c77;font-size:12px">${t2.location}</div></div><div style="text-align:end"><div style="font-weight:600">${t2.speed} ${t('km')}/h</div><div style="color:#727c77;font-size:12px">${timeAgo(t2.at)}</div></div></div>`).join('');
  const log = d.trackingLog.slice(0,15).map(l => `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef0ec;font-size:12.5px"><div><div style="font-weight:500">${vehicleLabel(l.vehicleId)}</div><div style="color:#727c77">${l.location}</div></div><div style="text-align:end;color:#727c77">${l.speed} ${t('km')}/h</div></div>`).join('');
  const alerts = computeAlerts().filter(a => a.view === 'tracking');
  return pageHead(t('tracking_title'), t('tracking_sub', d.tracking.filter(x => x.status==='moving').length),
    `<button class="btn-primary-sm" onclick="window.simulateTracking()">${icon('refresh',14)} ${t('update_locations')}</button>`) + `
    <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-bottom:20px">
      <div class="card"><div class="card-head"><h3>${t('map')}</h3></div><div class="card-body"><div class="map">${pins}</div></div></div>
      <div class="card"><div class="card-head"><h3>${t('current_locations')}</h3></div><div class="card-body" style="max-height:400px;overflow:auto">${live}</div></div>

window.simulateTracking = async () => {
  const places = [
    { name:'شارع الشيخ زايد — دبي', lat:25.2048, lng:55.2708, zone:null },
    { name:'طريق الإمارات — دبي', lat:25.2048, lng:55.2708, zone:null },
    { name:'الكورنيش — أبوظبي', lat:24.4539, lng:54.3773, zone:null },
    { name:'مطار دبي الدولي', lat:25.2532, lng:55.3657, zone:'airport' },
    { name:'مول الإمارات', lat:25.1181, lng:55.2003, zone:'mall' }
  ];
  const now = new Date().toISOString();
  try {
    for (const tr of state.data.tracking) {
      const p = places[Math.floor(Math.random()*places.length)];
      const speed = tr.status === 'moving' ? clamp(Math.round(40+Math.random()*80), 20, 120) : 0;
      const u = { location:p.name, lat:p.lat, lng:p.lng, zone:p.zone, speed, at:now, parkedSince:p.zone?now:null };
      await sbUpdate('tracking', tr.id, u);
      Object.assign(tr, u);
      const logRec = { id:uid('l'), vehicleId:tr.vehicleId, location:p.name, speed, status:tr.status, at:now };
      await sbInsert('trackingLog', logRec);
      state.data.trackingLog.unshift(logRec);
    }
    toast(t('updated')); await render();
  } catch(e) { toast(e.message,'red'); }
};

function renderDocuments() {
  const docs = state.data.documents;
  const expired = docs.filter(d => { const n = daysUntil(d.expiryDate); return n !== null && n < 0; }).length;
  const expiring = docs.filter(d => { const n = daysUntil(d.expiryDate); return n !== null && n >= 0 && n <= 30; }).length;
  return pageHead(t('documents_title'), t('documents_sub', docs.length, expiring, expired),
    `<button class="btn-primary-sm" onclick="window.addDoc()">${icon('plus',14)} ${t('add_document')}</button>`) + `
    <div class="stat-grid">
      ${stat(t('doc_valid'), docs.length - expired - expiring)}
      ${stat(t('doc_expiring'), expiring)}
      ${stat(t('doc_expired'), expired)}
    </div>
    <div class="card"><div class="card-head"><div class="search-box">${icon('search',14)}<input placeholder="${t('search_placeholder')}" value="${esc(q('documents'))}" oninput="window.searchDo('documents',this.value)"></div></div>
    <div style="overflow-x:auto"><table class="data-table"><thead><tr><th>${t('vehicle')}</th><th>${t('type')}</th><th>${t('doc_name')}</th><th>${t('issue_date')}</th><th>${t('expiry_date')}</th><th>${t('status')}</th><th></th></tr></thead><tbody id="tbody-documents">${documentRows()}</tbody></table></div></div>`;
}

window.addDoc = () => openModal({
  title:t('add_document'), submitLabel:t('add'),
  body:`<div class="grid-2">
    ${vehicleSelect()}
    ${selectField(t('type'),'type',DOC_TYPES,'registration')}
    ${field(t('doc_name'),'name','')}
    ${field(t('doc_number'),'number','')}
    ${field(t('issue_date'),'issueDate',todayISO(),{type:'date'})}
    ${field(t('expiry_date'),'expiryDate','',{type:'date',required:true})}
    ${field(t('issuer'),'issuer','')}
    ${textareaField(t('notes'),'notes','')}
  </div>`,
  onSubmit: async fd => {
    if (!fd.vehicleId||!fd.expiryDate) { toast(t('complete_fields_required'),'red'); return false; }
    const rec = { id:uid('doc'), vehicleId:fd.vehicleId, type:fd.type, name:fd.name?.trim()||'', number:fd.number?.trim()||'', issueDate:fd.issueDate||null, expiryDate:fd.expiryDate, issuer:fd.issuer?.trim()||'', notes:fd.notes?.trim()||'' };
    try { await sbInsert('documents', rec); state.data.documents.push(rec); toast(t('added')); await render(); }
    catch(e) { toast(e.message,'red'); return false; }
  }
});

window.editDoc = id => {
  const d = state.data.documents.find(x=>x.id===id); if (!d) return;
  openModal({ title:t('edit'), submitLabel:t('save'),
    body:`<div class="grid-2">
      ${vehicleSelect(d.vehicleId)}
      ${selectField(t('type'),'type',DOC_TYPES,d.type)}
      ${field(t('doc_name'),'name',d.name)}
      ${field(t('doc_number'),'number',d.number)}
      ${field(t('issue_date'),'issueDate',d.issueDate,{type:'date'})}
      ${field(t('expiry_date'),'expiryDate',d.expiryDate,{type:'date'})}
      ${field(t('issuer'),'issuer',d.issuer)}
      ${textareaField(t('notes'),'notes',d.notes||'')}
    </div>`,
    onSubmit: async fd => {
      const u = { vehicleId:fd.vehicleId, type:fd.type, name:fd.name?.trim()||'', number:fd.number?.trim()||'', issueDate:fd.issueDate||null, expiryDate:fd.expiryDate, issuer:fd.issuer?.trim()||'', notes:fd.notes?.trim()||'' };
      try { await sbUpdate('documents', id, u); Object.assign(d, u); toast(t('updated')); await render(); }
      catch(e) { toast(e.message,'red'); return false; }
    }
  });
};

window.deleteDoc = id => confirmDialog(t('delete'), t('confirm_delete'), async () => {
  try { await sbDelete('documents', id); state.data.documents = state.data.documents.filter(x=>x.id!==id); toast(t('deleted'),'red'); await render(); }
  catch(e) { toast(e.message,'red'); }
});

/* ═══════════════════════════════════════════════════════════════
   📊 Views — Reports
   ═══════════════════════════════════════════════════════════════ */
function renderReports() {
  const start = state.reportStart || monthStart();
  const end = state.reportEnd || todayISO();
  const inRange = d => d && d >= start && d <= end;
  const fuel = state.data.fuel.filter(f => inRange(f.date));
  const maint = state.data.maintenance.filter(m => m.status === 'closed' && inRange(m.maintenanceDate));
  const viol = state.data.violations.filter(v => inRange(v.date));
  const totalFuel = fuel.reduce((s,f) => s + Number(f.cost||0), 0);
  const totalMaint = maint.reduce((s,m) => s + Number(m.cost||0), 0);
  const totalViol = viol.reduce((s,v) => s + Number(v.amount||0), 0);
  const grandTotal = totalFuel + totalMaint + totalViol;
  const perVehicle = state.data.vehicles.map(v => {
    const vFuel = fuel.filter(f => f.vehicleId === v.id).reduce((s,f) => s + Number(f.cost||0), 0);
    const vMaint = maint.filter(m => m.vehicleId === v.id).reduce((s,m) => s + Number(m.cost||0), 0);
    const vViol = viol.filter(x => x.vehicleId === v.id).reduce((s,x) => s + Number(x.amount||0), 0);
    const vDist = (() => {
      const vf = fuel.filter(f => f.vehicleId === v.id).sort((a,b) => a.date.localeCompare(b.date));
      if (vf.length < 2) return 0;
      return Math.max(0, (vf[vf.length-1].odometer||0) - (vf[0].odometer||0));
    })();
    const total = vFuel + vMaint + vViol;
    return { vehicle: v, vFuel, vMaint, vViol, total, distance: vDist, costPerKm: vDist > 0 ? total/vDist : 0 };
  }).sort((a,b) => b.total - a.total);
  const maxPerVehicle = Math.max(...perVehicle.map(x => x.total), 1);
  const bar = (label, value, max, cls) => `<div class="report-bar"><div style="color:#727c77">${label}</div><div style="background:#eef0ec;border-radius:4px;overflow:hidden;height:8px"><div class="fill ${cls||''}" style="width:${Math.max((value/max)*100,1)}%"></div></div><div style="font-weight:600;text-align:end">${money(value)}</div></div>`;

  return pageHead(t('reports_title'), t('reports_sub', fmtDate(start), fmtDate(end)),
    `<button class="btn-ghost" onclick="window.exportReportCSV()">${icon('download',14)} ${t('export_csv')}</button>`) + `
    <div class="card"><div class="card-head"><h3>${t('period')}</h3></div>
      <div class="card-body"><div class="report-filter">
        <label class="field"><label>${t('from_date')}</label><input type="date" value="${start}" onchange="window.reportDate('start',this.value)"></label>
        <label class="field"><label>${t('to_date')}</label><input type="date" value="${end}" onchange="window.reportDate('end',this.value)"></label>
      </div></div>
    </div>
    <div class="stat-grid">
      ${stat(t('fuel_cost'), fmtNum(Math.round(totalFuel)), t('currency'))}
      ${stat(t('maintenance_cost'), fmtNum(Math.round(totalMaint)), t('currency'))}
      ${stat(t('violations_cost'), fmtNum(Math.round(totalViol)), t('currency'))}
      ${stat(t('total_label'), fmtNum(Math.round(grandTotal)), t('currency'))}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div class="card"><div class="card-head"><h3>${t('cost_distribution')}</h3></div>
        <div class="card-body"><div class="report-bars">
          ${bar(t('fuel_cost'), totalFuel, Math.max(totalFuel, totalMaint, totalViol, 1))}
          ${bar(t('maintenance_cost'), totalMaint, Math.max(totalFuel, totalMaint, totalViol, 1), 'amber')}
          ${bar(t('violations_cost'), totalViol, Math.max(totalFuel, totalMaint, totalViol, 1), 'red')}
        </div></div>
      </div>
      <div class="card"><div class="card-head"><h3>${t('top5')}</h3></div>
        <div class="card-body"><div class="report-bars">
          ${perVehicle.slice(0,5).map(x => bar(x.vehicle.plate, x.total, maxPerVehicle)).join('')}
        </div></div>
      </div>
    </div>
    <div class="card"><div class="card-head"><h3>${t('vehicle_details')}</h3></div>
    <div style="overflow-x:auto"><table class="data-table"><thead><tr>
      <th>${t('vehicle')}</th><th>${t('fuel_cost')}</th><th>${t('maintenance_cost')}</th><th>${t('violations_cost')}</th>
      <th>${t('total_label')}</th><th>${t('distance')}</th><th>${t('cost_per_km')}</th>
    </tr></thead><tbody>
      ${perVehicle.map(x => `<tr class="clickable" onclick="window.openVehicle('${x.vehicle.id}')">
        <td><div style="font-weight:600">${x.vehicle.make} ${x.vehicle.model}</div><div style="color:#727c77;font-size:12px">${x.vehicle.plate}</div></td>
        <td>${money(x.vFuel)}</td>
        <td>${money(x.vMaint)}</td>
        <td style="color:${x.vViol>0?'#9a5750':'inherit'}">${money(x.vViol)}</td>
        <td style="font-weight:600">${money(x.total)}</td>
        <td>${x.distance > 0 ? fmtNum(x.distance) + ' ' + t('km') : '—'}</td>
        <td>${x.costPerKm > 0 ? x.costPerKm.toFixed(2) : '—'}</td>
      </tr>`).join('')}
    </tbody></table></div></div>`;
}

window.reportDate = (k, v) => {
  if (k === 'start') state.reportStart = v;
  else state.reportEnd = v;
  render();
};

window.exportReportCSV = () => {
  const start = state.reportStart || monthStart();
  const end = state.reportEnd || todayISO();
  const fuel = state.data.fuel.filter(f => f.date >= start && f.date <= end);
  const maint = state.data.maintenance.filter(m => m.status === 'closed' && m.maintenanceDate >= start && m.maintenanceDate <= end);
  const viol = state.data.violations.filter(v => v.date >= start && v.date <= end);
  const rows = state.data.vehicles.map(v => {
    const vF = fuel.filter(f => f.vehicleId === v.id).reduce((s,f) => s + Number(f.cost||0), 0);
    const vM = maint.filter(m => m.vehicleId === v.id).reduce((s,m) => s + Number(m.cost||0), 0);
    const vV = viol.filter(x => x.vehicleId === v.id).reduce((s,x) => s + Number(x.amount||0), 0);
    return [v.plate, v.make + ' ' + v.model, vF, vM, vV, vF+vM+vV];
  });
  exportCSV(`report-${start}-to-${end}.csv`, [t('plate'),t('vehicle'),t('fuel_cost'),t('maintenance_cost'),t('violations_cost'),t('total_label')], rows);
};

/* ═══════════════════════════════════════════════════════════════
   📊 Views — Users
   ═══════════════════════════════════════════════════════════════ */
async function renderUsers() {
  if (!isAdmin()) return `<div style="padding:40px;text-align:center;color:#9a5750">${t('not_authorized')}</div>`;
  let users = [];
  try {
    const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    users = data || [];
  } catch(e) {
    return `<div class="card"><div class="card-body" style="padding:40px;text-align:center;color:#9a5750">${esc(e.message)}</div></div>`;
  }
  const admins = users.filter(u => u.role === 'admin').length;
  const myEmail = currentUser?.email;
  const rows = users.length ? users.map(u => {
    const isMe = u.email === myEmail;
    return `<tr>
      <td><div style="font-weight:600">${esc(u.full_name||'—')}</div><div style="color:#727c77;font-size:12px;direction:ltr">${esc(u.email||'')}</div></td>
      <td>${u.role==='admin'?`<span style="color:#5a7d63;font-weight:500">${t('admin')}</span>`:`<span style="color:#727c77">${t('user')}</span>`}</td>
      <td style="color:#727c77">${fmtDate((u.created_at||'').slice(0,10))}</td>
      <td class="actions">${isMe ? `<span style="color:#9aa39e;font-size:11.5px">${t('you')}</span>` : `<button class="icon-btn" onclick="window.toggleRole('${u.id}','${u.role}')" title="${t('change_role')}">${icon('user',14)}</button>`}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="4" style="text-align:center;padding:30px;color:#727c77">${t('no_users')}</td></tr>`;
  return pageHead(t('users_title'), t('users_sub', users.length, admins)) + `
    <div class="card"><div class="card-head"><h3>${t('user_list')}</h3></div>
    <div style="overflow-x:auto"><table class="data-table"><thead><tr><th>${t('user')}</th><th>${t('role')}</th><th>${t('created_at')}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

window.toggleRole = async (id, cur) => {
  if (!isAdmin()) return toast(t('not_authorized'),'red');
  const next = cur === 'admin' ? 'user' : 'admin';
  try {
    const { error } = await sb.from('profiles').update({ role: next }).eq('id', id);
    if (error) throw error;
    toast(t('role_changed') + ' ' + (next === 'admin' ? t('admin') : t('user')));
    await render();
  } catch(e) { toast(e.message,'red'); }
};

/* ═══════════════════════════════════════════════════════════════
   📋 bodyRenderers — الجدول المحدّث
   ═══════════════════════════════════════════════════════════════ */
const bodyRenderers = {
  vehicles: vehicleRows,
  drivers: driverRows,
  maintenance: maintenanceRows,
  tasks: taskRows,
  requests: requestRows,
  violations: violationRows,
  documents: documentRows,
  fuel: fuelRows
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', attachAuthListeners);
} else {
  attachAuthListeners();
}

})();
</script>
